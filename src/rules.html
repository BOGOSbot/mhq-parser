<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>40k rules</title>
<!-- The record card's stylesheet: the same string the wiki render writes as
     card.css, served once for every surface that shows a record. -->
<link rel="stylesheet" href="/card.css">
<!-- The wiki shell: the same file the wiki render writes as shell.css, so the
     top bar and the tree are one asset on both surfaces. -->
<link rel="stylesheet" href="/rules/surface.css">
<!-- The tab and home-screen icons: the 32x32 PNG and the 180x180 touch icon. -->
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- The tree: one implementation, written by the wiki render and served from
     there. tree/index.js is the cascade's root (three branches); shell.js fetches
     the drawer the surface mounts, opened by the Wiki control. -->
<!-- The wiki is the surface's drawer now (task-77). It mounts itself on #wikinav
     and reads the baked payloads; the page keeps its own ask, findings and
     passages untouched. -->
<script>window.WIKI_SURFACE = { data: '/rules/data', record: '/rules/record', mode: 'drawer', toggle: '#wikinav' };</script>
<script src="/rules/surface.js" defer></script>
<style>

/* ============================================================================
   40k rules — the surface's visual system.
   Direction: the rulebook page, not a dashboard. Paper and ink, a rulebook
   serif for what you read (rule text, titles), a grotesque for what you use
   (labels, controls), and the rule's own number as the structural device -
   it is already in the corpus, so it carries the hierarchy. Light by default
   because this page is read at a table in daylight and handed to an opponent;
   the dark scheme keeps the same shapes for a night game.
   ========================================================================== */
:root{
  --bg:#eeefe8; --panel:#fbfbf6; --panel2:#e6e7de; --line:#d2d4c7;
  --txt:#191a1d; --ink:#191a1d; --dim:#5e6468; --chip:#e6e7de;
  --acc:#22386b; --accent:#22386b; --fg:#191a1d;
  --ok:#2c6a45; --warn:#87530f; --err:#a22b22;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Charter","Iowan Old Style","Sitka Text",Cambria,Georgia,"Noto Serif",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(24,26,29,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14151a; --panel:#1b1d23; --panel2:#23262d; --line:#30333b;
    --txt:#ecebe4; --ink:#ecebe4; --dim:#9aa0a8; --chip:#23262d;
    --acc:#9bb4ea; --accent:#9bb4ea; --fg:#ecebe4;
    --ok:#79c495; --warn:#dcb05c; --err:#e88981;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:15px/1.6 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:var(--panel)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- chrome ---------------------------------------------------------------
   One row, whatever the width: the page is a tool you put away, so the bar
   carries identity, the two destinations and the two settings, nothing else. */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--line);padding:0 14px}
.row{display:flex;gap:10px;align-items:center;min-height:56px}
h1{font:600 17px/1 var(--serif);margin:0;letter-spacing:-.01em;white-space:nowrap;flex:0 0 auto}
h1 span{color:var(--dim);font-weight:400;margin-left:.18em}
.spacer{flex:1}
a.nav{color:var(--dim);font:12.5px/1 var(--sans);text-decoration:none;padding:8px 2px;white-space:nowrap}
a.nav:hover{color:var(--txt)}
select.lang{background:none;color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:6px 4px;font:600 11.5px/1 var(--sans);letter-spacing:.02em;margin:0;appearance:none;text-align:center}
select.lang:focus{outline:none;border-color:var(--acc);color:var(--txt)}
#wikinav{background:none;border:1px solid var(--line);color:var(--txt);border-radius:999px;
  padding:9px 14px;font:600 12.5px/1 var(--sans);height:38px}
#wikinav:hover{border-color:var(--acc);color:var(--acc)}
#wikinav[aria-expanded="true"]{background:var(--acc);border-color:var(--acc);color:var(--panel)}
@media (max-width:520px){#wahalink{display:none}}
@media (max-width:360px){a.nav{display:none}}

/* --- the ask: the one thing this page is for ------------------------------
   A card you type into, not a form field under a title bar. The send button
   lives inside it; the microphone is a quiet neighbour. The border is the
   only chrome: no shadow art, no gradient. */
main{padding:18px 16px 90px;max-width:780px;margin:0 auto}
.askwrap{margin:0 0 6px}
form#f{display:block;margin:0}
.field{display:flex;align-items:flex-end;gap:6px;background:var(--panel);
  border:1.5px solid var(--line);border-radius:18px;padding:7px 7px 7px 15px;
  box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 12%,transparent)}
textarea#q, textarea.trbox{flex:1 1 auto;min-width:0;min-height:40px;max-height:168px;background:none;
  color:var(--txt);border:0;padding:10px 0 11px;margin:0;font:16px/1.5 var(--sans);line-height:1.5;
  resize:none;overflow-y:auto;outline:none}
textarea#q::placeholder, textarea.trbox::placeholder{color:var(--dim);opacity:1}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:9px 8px;font:13px var(--sans)}
select:focus{outline:none;border-color:var(--acc)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px;
  cursor:pointer;user-select:none;white-space:nowrap}
label.chk input{accent-color:var(--acc)}
button{font:inherit}
/* Icon only: the name is on the aria-label and the tooltip. Both icons are
   44px targets; the send is the only filled control on the page. */
button.mic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  flex:0 0 auto;padding:0;background:none;color:var(--dim);
  border:0;border-radius:12px}
button.mic:hover{color:var(--txt);background:var(--panel2)}
button.mic.on{color:#fff;background:var(--err);animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{0%,100%{opacity:1}50%{opacity:.62}}
button.sendbtn{width:44px;height:44px;padding:0;flex:0 0 auto;display:inline-flex;
  align-items:center;justify-content:center;border-radius:14px;background:var(--acc);
  color:var(--panel);border:0;transition:transform .12s ease,opacity .12s ease}
button.sendbtn:hover{filter:none;background:color-mix(in srgb,var(--acc) 86%,var(--txt))}
button.sendbtn:active{transform:scale(.94)}
button.sendbtn:disabled{opacity:.45}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button::after{transition:none}
/* The judge dial and the run status share the line under the field. */
.askmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 2px 0;min-height:26px}
.modegrp{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.modelead{color:var(--dim);font:400 11.5px var(--sans);margin-right:3px}
.modebtn{border:0;background:none;color:var(--dim);border-radius:999px;padding:5px 9px;
  font:500 11.5px/1 var(--sans);cursor:pointer;letter-spacing:.01em}
.modebtn:hover{color:var(--txt)}
.modebtn.on{background:var(--panel2);color:var(--txt);font-weight:650}
.status{font:12px/1.4 var(--mono);color:var(--dim);min-height:17px;flex:1 1 120px;min-width:0}
.status.err{color:var(--err)}
.status.busy{color:var(--acc)}
.status.ok{color:var(--ok)}

/* The book's three doors, one quiet line under the question. */
.browse{display:flex;gap:4px;flex-wrap:wrap;align-items:baseline;margin:14px 0 0;
  color:var(--dim);font:12px/1.6 var(--sans)}
.browselink{border:0;background:none;color:var(--acc);font:600 12px/1.6 var(--sans);
  padding:2px 3px;border-radius:6px;cursor:pointer;text-decoration:underline;
  text-decoration-color:color-mix(in srgb,var(--acc) 35%,transparent);text-underline-offset:3px}
.browselink:hover{text-decoration-color:var(--acc)}
.browselink + .browselink:before{content:'\00b7';color:var(--dim);margin-right:7px;text-decoration:none}
/* The explainer is a footnote, not a landing page: one line to open it. */
.howto{margin:18px 0 0;border-top:1px solid var(--line);padding-top:11px}
.howto summary{color:var(--dim);font:12.5px/1 var(--sans);cursor:pointer;list-style:none;
  display:inline-flex;align-items:center;gap:7px;padding:3px 0}
.howto summary::-webkit-details-marker{display:none}
.howto summary:before{content:'';width:7px;height:7px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-top:-2px;transition:transform .15s}
.howto[open] summary:before{transform:rotate(45deg);margin-top:-4px}
.howto summary:hover{color:var(--txt)}
.intro{color:var(--dim);font-size:13.5px;line-height:1.6;margin:12px 0 0;max-width:66ch}
.intro ol{margin:10px 0 0;padding-left:20px}
.intro li{margin:4px 0}
.intro b{color:var(--txt);font-weight:600}
.intro code{font:11.5px var(--mono);color:var(--txt);background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.note{color:var(--dim);font-size:12.5px;line-height:1.5}
.note.warn{color:var(--warn)}
.note.ok{color:var(--ok)}
.retention{font-size:11.5px;line-height:1.55;margin:16px 0 0;max-width:60ch;opacity:.9}

/* --- the answer shell ----------------------------------------------------- */
#result{margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin:16px 0;box-shadow:var(--shadow)}
@media (max-width:480px){.card{padding:14px;border-radius:14px;margin:14px 0}}
.answer{font:16px/1.65 var(--serif);color:var(--txt)}
.answer p{margin:0 0 12px}
.answer p:last-child{margin-bottom:0}
.answer ul{margin:0 0 12px;padding-left:22px}
.answer li{margin:4px 0}
.answer blockquote{margin:0 0 12px;padding:2px 0 2px 14px;border-left:2px solid var(--line);color:var(--txt)}
.answer b{color:var(--ink)}
a.cite{color:var(--acc);text-decoration:none;font:600 10.5px var(--sans);vertical-align:super;padding:0 1px}
a.cite:hover{text-decoration:underline}
h2{font:600 12px/1.3 var(--sans);letter-spacing:.02em;color:var(--dim);
  margin:0 0 12px;font-weight:600;text-transform:none}
.card.arrived{animation:arrive 1.4s ease-out}
@keyframes arrive{0%{box-shadow:0 0 0 2px var(--acc) inset}100%{box-shadow:var(--shadow)}}
.note.waiting{opacity:.6}
.conf{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.04em;border-radius:999px;
  padding:4px 9px;margin-bottom:8px;border:1px solid var(--line);color:var(--dim);background:transparent}
.conf.high{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.conf.med{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.conf.low{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.conf.rerun{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);margin-right:6px}

/* --- stage progress: a thin rule, not a dashboard ------------------------- */
.progress{display:flex;align-items:center;gap:10px;margin:12px 0 0;max-width:640px}
.progress.hidden{display:none}
.psegs{display:flex;gap:3px;flex:1}
.pseg{flex:1;position:relative;height:4px;border-radius:999px;background:var(--panel2);overflow:hidden}
.pseg span,.pseg em{display:none}
.pseg .pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);opacity:0;transition:width .35s ease,opacity .35s ease}
.pseg.active .pfill{width:100%;opacity:.55;animation:pshimmer 1.3s ease-in-out infinite}
.pseg.done .pfill{width:100%;opacity:1;background:var(--ok)}
.pelapsed{font:11px var(--mono);color:var(--dim);min-width:34px;text-align:right}
@keyframes pshimmer{0%,100%{opacity:.3}50%{opacity:.75}}

/* --- findings: the product -------------------------------------------------
   Rows on the page, not cards in a grid: the number is the rule's own, the
   title is set in the rulebook face, and everything that is instrumentation
   (which retriever found it, its rank score) moves to the dev panel. */
.findingsslot{margin:0}
ol.cites{list-style:none;margin:0;padding:0}
ol.cites li.fitem{display:block}
.fitem{padding:15px 0 14px;border-top:1px solid var(--line);cursor:pointer}
.fitem:first-child{border-top:0;padding-top:2px}
.fitem.dropped{opacity:.42}
.fhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font:600 11px/1 var(--sans);color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:5px 7px;margin-top:0;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--bg)}
.fitem .num{margin-top:0}
.ftitle{color:var(--ink);text-decoration:none;font:600 17.5px/1.25 var(--serif);
  letter-spacing:-.01em;overflow-wrap:anywhere}
.ftitle:hover{color:var(--acc)}
.leg{font:600 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:4px 7px;border:1px solid var(--line);color:var(--dim);background:transparent}
/* Instrumentation is not the reader's business at rest; the dev panel carries it. */
.fhead .leg.vec,.fhead .leg.lex,.fhead .leg.anchor{display:none}
.leg.cite{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.badgetop{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.badgeign{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.fcrumbs{color:var(--dim);font-size:11.5px;line-height:1.4;margin:5px 0 0;overflow-wrap:anywhere}
.ftext{font:15px/1.5 var(--serif);color:var(--dim);margin:7px 0 0}
.heroline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--txt);border-radius:3px;padding:0 2px}
.fctl{margin-left:auto;display:flex;gap:4px;align-items:center;align-self:center}
.fctl button{min-width:44px;min-height:44px;padding:0 6px;border:1px solid transparent;border-radius:11px;
  background:none;color:var(--dim);font:600 14px var(--sans);cursor:pointer}
.fctl button:hover{background:var(--panel2);color:var(--txt)}
.herocaret{color:var(--ok);border-color:transparent}
.herocaret.on{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok);color:var(--ok)}
.herox.on{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent);background:color-mix(in srgb,var(--err) 9%,transparent)}
.herodev.on{color:var(--acc);border-color:var(--acc)}
.fmeta{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font:11px/1.4 var(--mono);margin-top:6px}
.fmeta .score{color:var(--acc)}
.fmeta .words{color:var(--warn)}
.fdev{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fdev .pbody{margin-top:10px}
.fdev .devleg{color:var(--dim)}
.flinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.linkchip{position:relative;display:inline-block;padding:4px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel2);color:var(--acc);font:11.5px var(--sans);text-decoration:none}
.linkchip:hover,.linkchip:focus-visible{border-color:var(--acc)}
.linkprev{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:180px;max-width:300px;
  padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  box-shadow:0 8px 24px rgba(0,0,0,.22);color:var(--txt);font:11.5px var(--mono);overflow-wrap:anywhere}
.linkprev b{display:block;margin-bottom:3px;color:var(--txt);font:600 12px var(--sans)}
.linkprev span{color:var(--dim)}
.linkchip:hover .linkprev,.linkchip:focus-visible .linkprev{display:block}
.fitem.hero{cursor:pointer}
details.moref{margin-top:12px}
details.moref summary{color:var(--dim);font:12px var(--sans);cursor:pointer}
details.moref summary:hover{color:var(--txt)}
details{border-color:var(--line)}
/* The judge: a verdict stripe under the findings' title, not a competing card. */
#verdict h2,.card h2{color:var(--dim)}
.secondv{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.dispute{margin-top:12px;padding:12px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);
  border-radius:12px;background:color-mix(in srgb,var(--warn) 7%,transparent)}
.dispute .dtitle{color:var(--warn);font:600 11px var(--sans);letter-spacing:.04em;margin-bottom:5px}
.dispute .note{margin-top:0}
.dissent{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.dissent .dtitle{color:var(--dim);font:600 11px var(--sans);letter-spacing:.04em;margin-bottom:5px}
.dissent .note{margin-top:0}
/* task-24 (J4): the ruling, not a verdict stripe. The answer is the slots a rules
   answer has - the line, the rule's own words behind a navy rule, the source named
   by TITLE, the named rules that change it, what the corpus does not cover. There
   is no confidence chip, no 'why' toggle and no 'passages it rests on' line:
   `why` and `confidence` stay in the payload for the trace, and the ledger below
   the ruling is those passages. */
.ruling{margin:10px 0 0}
.rline{font:500 16.5px/1.45 var(--sans);color:var(--ink);margin:0}
.rquote{font:15.5px/1.5 var(--serif);color:var(--ink);margin:10px 0 0;padding:0 0 0 12px;
  border-left:2px solid var(--acc)}
.rquote.bad{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1px}
.rstrike{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1px}
.rsrc{margin:7px 0 0;font:11px/1.4 var(--mono);color:var(--dim);padding-left:14px}
.rsrc a{color:var(--acc);text-decoration:none}
.rsrc a:hover{text-decoration:underline}
.rsrc .srule{margin-left:7px}
.rex{margin:10px 0 0;font:13px/1.6 var(--sans);color:var(--dim);padding-left:14px}
.rex a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 28%,transparent)}
.rex .dot{color:var(--line);margin:0 6px}
.rmiss{margin:10px 0 0;font:13.5px/1.55 var(--sans);color:var(--dim);padding-left:12px;
  border-left:2px solid var(--line)}
.rtrace{margin:9px 0 0;font:11px/1.4 var(--mono);color:var(--warn);padding-left:14px}
/* task-25: the ruling and the ledger are blocks in the page flow, not cards. The
   mockup has no border and no heading over the ruling: the sans answer line over
   the serif quote is what says the machine is talking. */
.ruleblock{margin:14px 0 0}
.ledger{margin:14px 0 0}
/* the ledger: no chips, no borders, no rank numbers - the used passages are the
   rows shown in full, and the rest is one collapsed line. */
.lname{display:block;font:600 16px/1.25 var(--serif);color:var(--ink);letter-spacing:-.01em}
.lpath{font:11px/1.4 var(--mono);color:var(--dim);margin-top:4px;overflow-wrap:anywhere}
.lmark{font:11px/1.4 var(--mono);color:var(--dim);margin-top:6px;opacity:.7}
/* The ledger row is a row, not a button: no chrome, the whole width live. */
.lrow{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.lrow .lname{display:block}
.lrow .lpath{display:block;margin-top:3px;font-size:10.5px}
.fitem.cited .ftext{margin-top:8px}
.fitem.cited{padding:11px 0 10px}
.resid{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:6px;
  padding:13px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--dim);
  font:12px var(--sans);cursor:pointer}
.resid:hover{color:var(--txt)}
.resid .chev{font:13px var(--mono)}
.resid>span:first-child{flex:1 1 auto;min-width:0;overflow:hidden}
.resid .rnames{display:block;margin-top:3px;font:10.5px/1.35 var(--mono);color:var(--dim);opacity:.8;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem.res{display:flex;gap:8px;align-items:baseline;padding:9px 0 8px;
  border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.rname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:12.5px/1.35 var(--serif);color:var(--txt)}
.rpath{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right;font:10.5px/1.35 var(--mono);color:var(--dim)}
details.secondv{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.secondv summary{list-style:none;cursor:pointer;color:var(--dim);font:12px/1.45 var(--sans)}
.secondv summary::-webkit-details-marker{display:none}
.secondv summary:hover{color:var(--txt)}
.fhead .leg.both,.fhead .leg.cite{display:none}
.linkchip{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  vertical-align:bottom;display:inline-block}

/* --- the one door (task-8) ------------------------------------------------
   A finding row opens the door the Quick / In the book switch names, and the
   section path under it follows. The same switch rides in the quick record's
   header and in the drawer's head, so one control is taught once and kept. */
.fpath{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  font:inherit;color:inherit;cursor:pointer}
.fpath:hover{color:var(--txt)}
.fpath .door{color:var(--acc);font-weight:600;white-space:nowrap;margin-left:1px}
.fmore{margin-left:auto;min-width:44px;min-height:44px;padding:0 8px;border:1px solid transparent;
  border-radius:11px;background:none;color:var(--dim);font:600 17px var(--sans);cursor:pointer;align-self:center}
.fmore:hover{background:var(--panel2);color:var(--txt)}
.doorseg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:transparent}
.doorseg button{min-height:34px;padding:0 13px;border:0;border-radius:999px;background:none;
  color:var(--dim);font:600 12.5px var(--sans);cursor:pointer}
.doorseg button:hover{color:var(--txt)}
.doorseg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sv-drawer-head .doorseg{margin-left:auto}
.sv-drawer-head .doorseg button{min-height:34px;padding:0 10px;font-size:11px}
.fsheet .sheethead{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.fsheet .sheetx{margin-left:auto;background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font:16px var(--sans);line-height:1;cursor:pointer}
.fsheet .sheettitle{font:600 17px/1.25 var(--serif);color:var(--ink)}
.fsheet .sheetcrumb{color:var(--dim);font:11.5px var(--mono);margin-top:3px;overflow-wrap:anywhere}
.sheetact{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;border:0;
  border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 2px;
  color:var(--txt);font:600 14.5px var(--sans);cursor:pointer}
.sheetact:last-child{border-bottom:0}
.sheetact:hover{color:var(--acc)}
.sheetact .ico{flex:0 0 auto;width:22px;text-align:center;color:var(--dim);font:600 14px var(--sans)}
.sheetact .hint{margin-left:auto;color:var(--dim);font:10.5px/1.3 var(--sans);text-align:right;max-width:44%}
.sheetact.on{color:var(--ok)}
.sheetact.on .ico{color:var(--ok)}
.sheetact.ign.on{color:var(--err)}
.sheetact.ign.on .ico{color:var(--err)}
.sheetfoot{color:var(--dim);font:10.5px/1.4 var(--sans);padding:10px 2px 2px;text-align:center}

/* --- settings: one full-screen sheet in the drawer's pattern --------------- */
.gearbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--txt);cursor:pointer}
.gearbtn:hover{color:var(--acc);border-color:var(--acc)}
body.sheetopen{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .2s cubic-bezier(.32,.72,0,1);overscroll-behavior:contain}
.sheet.open{transform:translateY(0)}
.sheet.hidden{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;min-height:54px}
.sheet-head strong{font:600 19px/1.1 var(--serif);letter-spacing:-.01em}
.sheet-close{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;
  padding:8px 14px;font:600 12px var(--sans);cursor:pointer}
.sheet-close:hover{color:var(--txt);border-color:var(--acc)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.sheetrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--line)}
.sheetwhat{min-width:0;display:flex;flex-direction:column;gap:3px}
.sheetlabel{font:600 15.5px var(--serif);color:var(--ink)}
.sheethint{color:var(--dim);font:11.5px/1.4 var(--sans)}
.sheetrow .doorseg{flex:0 0 auto}
.sheetmeta{color:var(--dim);font:11.5px/1.5 var(--mono);margin:18px 0 0}
@media (min-width:760px){.sheet-head,.sheet-body{width:100%;max-width:640px;margin:0 auto}}

/* --- unit card: a datasheet, one-handed ------------------------------------ */
.unitcard .uname{font:600 21px/1.2 var(--serif);color:var(--ink)}
.unitcard h3{font:600 11px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;
  color:var(--dim);margin:16px 0 7px}
.usub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.urole{color:var(--dim);font-size:12.5px}
.upoints{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ustat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:48px;text-align:center}
.stat .k{display:block;font:600 9.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.stat .v{display:block;font:700 15px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.stat.inv .v{color:var(--acc)}
.umodel{margin-top:12px}
.umodelname{font-size:13px;color:var(--txt);margin-bottom:2px}
.unote{color:var(--dim);font-size:12px;margin-top:8px}
.unote a{color:var(--acc);text-decoration:none}
.unote a:hover{text-decoration:underline}
table.uw{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px;margin-top:2px}
table.uw th{font:600 9.5px var(--sans);letter-spacing:.03em;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:4px 3px;border-bottom:1px solid var(--line)}
table.uw td{padding:6px 3px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.uw td.wn{overflow-wrap:anywhere}
table.uw th:first-child,table.uw td:first-child{width:34%}
table.uw th:not(:first-child),table.uw td:not(:first-child){width:11%;text-align:center}
.wnote{display:block;color:var(--dim);font-size:10.5px;font-style:italic}
.uab{margin-top:10px}
.uabhead{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.uabname{font-weight:600;color:var(--txt)}
a.uabname.ulink{color:var(--acc);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc) 45%,transparent);text-underline-offset:2px}
a.uabname.ulink:hover{text-decoration-color:var(--acc)}
.uabtext{margin:4px 0 0;font:15px/1.55 var(--serif);color:var(--txt)}
.ukw{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ukw .klabel{color:var(--dim);font:11px var(--sans);align-self:center}
.ukw .src{font-size:11px}
.ulegend{margin:16px 0 0;color:var(--dim);font-size:12.5px;font-style:italic;font-family:var(--serif)}
.tag{font:600 9.5px var(--sans);letter-spacing:.04em;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;margin-right:8px;vertical-align:1px}
.tag.faction{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.srcs{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.src{font:11.5px var(--mono);color:var(--dim);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;text-decoration:none;overflow-wrap:anywhere}
.src:hover{color:var(--txt);border-color:var(--acc)}
.hidden{display:none!important}

/* --- the record dialog ---------------------------------------------------- */
body.recopen{overflow:hidden}
.record{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.record.hidden{display:none}
.recbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;padding:8px 10px;
  border-bottom:1px solid var(--line);background:var(--panel);min-height:56px}
.reckind{flex:0 0 auto;font:600 9.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:5px;padding:3px 7px;color:var(--dim)}
.rectitle{flex:1 1 auto;min-width:0;font:600 15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recpos{flex:0 0 auto;color:var(--dim);font:11px var(--mono)}
.recclose{flex:0 0 auto;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:12px;
  background:transparent;color:var(--txt);font:400 22px var(--sans);line-height:1;cursor:pointer}
.recclose:hover{border-color:var(--acc);color:var(--acc)}
.recbody{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 16px 56px;max-width:100%}
.recbody *{max-width:100%}
.reccrumb{color:var(--dim);font:11.5px var(--mono);margin-bottom:10px;overflow-wrap:anywhere}
.recctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.recctl .fctl{margin-left:0}
.recwiki{min-height:44px;display:inline-flex;align-items:center;padding:10px 14px;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--acc);font:600 13px var(--sans);text-decoration:none}
.recwiki:hover{border-color:var(--acc)}
.rectext{overflow-wrap:anywhere;font-family:var(--serif);font-size:16px;line-height:1.65}
.rectext p{margin:0 0 12px;line-height:1.65}
.recswipe{color:var(--dim);font:11.5px var(--sans);margin:16px 0 0}
@media (min-width:640px){.recbody{width:100%;max-width:46rem;margin:0 auto}}

/* --- the passage sheet ---------------------------------------------------- */
.pop{position:fixed;inset:0;z-index:40;background:rgba(12,13,16,.55);display:flex;align-items:flex-end;justify-content:center}
.pop.hidden{display:none}
.popsheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
  max-width:720px;max-height:82vh;overflow:auto;padding:16px 16px 22px}
.popbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.popclose{margin-left:auto;background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font:11.5px var(--sans)}
.popclose:hover{color:var(--txt);border-color:var(--acc)}
.pcrumbs,.pcrum{color:var(--dim);font:11.5px var(--mono);margin-bottom:8px}
.pcrum .here{color:var(--txt)}
.pcrum .sep{opacity:.6}
.pbody{font:15px/1.6 var(--serif)}
.pbody p{margin:0 0 10px}
.pbody p:last-child{margin-bottom:0}
.psource{display:inline-block;margin-top:12px;color:var(--acc);text-decoration:none;font-size:12.5px}
.psource:hover{text-decoration:underline}
@media (min-width:560px){.pop{align-items:center;padding:20px}.popsheet{border-radius:18px}}

/* --- reader feedback: one row of quiet controls --------------------------- */
.vote{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.vote .vq{color:var(--dim);font:500 13px var(--sans);margin-bottom:10px}
.vote .vbtns{display:flex;gap:10px}
.vote .vbtn{min-height:44px;min-width:112px;padding:10px 16px;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--fg);font:600 14px var(--sans);cursor:pointer}
.vote .vbtn[aria-pressed='true']{border-color:var(--accent);color:var(--accent)}
.vote .vnote{margin-top:8px;color:var(--dim);font:400 12.5px var(--sans);min-height:15px}
.pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pickrow .pickq{flex:1 1 240px;color:var(--dim);font:500 13px var(--sans)}
.pickbtn{min-height:44px;margin-left:8px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;
  background:transparent;color:var(--fg);font:600 13.5px var(--sans);cursor:pointer}
.picknone{min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;
  background:transparent;color:var(--fg);font:600 13.5px var(--sans);cursor:pointer}
.pickbtn.on,.picknone.on{border-color:var(--accent);color:var(--accent)}
.pickrow .picknote{flex:1 1 100%;color:var(--dim);font:400 12.5px var(--sans);min-height:15px}

/* --- manual rerank -------------------------------------------------------- */
.rerun{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.rerun .card{margin-top:0}
.rerunfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rerunbtn{min-height:44px}

/* --- footer --------------------------------------------------------------- */
.foot{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:8px 16px 32px;color:var(--dim);font:11.5px var(--sans)}
.footlinks{display:flex;gap:6px;align-items:center}
.footlinks a{display:inline-flex;color:var(--dim);padding:6px;border-radius:9px}
.footlinks a:hover{color:var(--txt);background:var(--panel2)}
.corpusdate{color:var(--dim);font:11.5px var(--sans);border-left:1px solid var(--line);padding-left:16px}
a{color:var(--acc)}
/* --- the translation of a non-English question ---------------------------- */
#trslot{margin-top:10px}
.trrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;border:1.5px solid var(--line);
  border-radius:16px;background:var(--panel);padding:6px 6px 6px 10px;box-shadow:var(--shadow)}
.trrow:focus-within{border-color:var(--acc)}
/* task-22: the queued state of a correction made while a run is in flight. */
.trrow.queued{border-color:var(--acc);border-style:dashed}
.trqueue{margin-top:6px;color:var(--acc);font:11.5px/1.4 var(--sans)}
.trmark{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:44px;color:var(--dim);user-select:none}
.trmark svg{width:12px;height:12px;transform:rotate(45deg)}
details pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;margin:8px 0 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;
  max-height:260px;overflow:auto;color:var(--txt)}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="h1">40k <span>rules</span></h1>
    <a class="nav" id="navparse" href="/">Parser</a>
    <a class="nav" id="wahalink" href="https://wahapedia.ru/" target="_blank" rel="noopener">Wahapedia</a>
    <span class="spacer"></span>
    <!-- Settings is one sheet, not a second route: voice and findings live here. -->
    <button type="button" id="settingsbtn" class="gearbtn" title="Settings" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.86a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.14.63.62 1.13 1.25 1.28H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
    </button>
    <!-- The wiki is the whole rulebook: a drawer over this page, remembered. -->
    <button type="button" id="wikinav" aria-expanded="false">Wiki</button>
    <select id="lang" class="lang" title="Page and answer language">
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>
<main>
  <!-- The ask IS the page: a card you type into. The send control sits inside
       it, the microphone beside it, and no chrome stands between the question
       and the answer. -->
  <section class="askwrap">
    <form id="f">
      <div class="field">
        <textarea id="q" rows="1" spellcheck="false" autocomplete="off"
               placeholder="Ask a rules question — e.g. can a unit shoot after it Fell Back?"></textarea>
        <button type="button" id="mic" class="mic" title="Ask by voice" aria-label="Ask by voice"></button>
        <button id="go" type="submit" class="sendbtn"></button>
      </div>
    </form>
    <div id="trslot" class="hidden"></div>
    <div class="askmeta">
      <!-- The judge dial: fast (one judge, no reasoning) against deep (the judge
           reasons). It moves retrieval depth too; the note says so. -->
      <span class="modegrp" role="group" aria-label="Judge reasoning">
        <span class="modelead" id="modelead">Judge</span>
        <button type="button" class="modebtn on" id="modeFast" data-mode="fast" aria-pressed="true">fast</button>
        <button type="button" class="modebtn" id="modeDeep" data-mode="deep" aria-pressed="false">deep</button>
      </span>
      <div id="status" class="status"></div>
    </div>
    <div id="progress" class="progress hidden"><div class="psegs" id="psegs"></div><span id="pelapsed" class="pelapsed"></span></div>
  </section>
  <div id="intro">
    <!-- Finding a rule by name is one act; browsing the whole book is the other.
         The three books are one tap away, not hidden behind the drawer button. -->
    <div class="browse" id="browse"></div>
    <!-- The explainer is a footnote you can open, not the landing page. -->
    <details class="howto">
      <summary id="howtosum">How this works</summary>
      <div class="intro" id="introtext"></div>
    </details>
  </div>
  <p class="note retention" id="retention"></p>
  <div id="result" class="hidden"></div>
</main>

<!-- Settings: one full-screen sheet in the drawer's pattern - voice and findings,
     plus the corpus date and edition line the footer already prints. -->
<div class="sheet hidden" id="gearsheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="geartitle">
  <div class="sheet-head">
    <strong id="geartitle">Settings</strong>
    <button type="button" class="sheet-close" id="gearclose">Close</button>
  </div>
  <div class="sheet-body">
    <div class="sheetrow">
      <div class="sheetwhat">
        <span class="sheetlabel" id="voiceSettingLabel">Voice</span>
        <span class="sheethint" id="voiceSettingHint">Gemini transcribes with the 40k glossary; the browser recogniser is the free fallback.</span>
      </div>
      <span class="doorseg" role="tablist" aria-label="Voice" id="voiceseg">
        <button type="button" data-voice="gemini">Gemini</button>
        <button type="button" data-voice="browser">Browser</button>
      </span>
    </div>
    <div class="sheetrow">
      <div class="sheetwhat">
        <span class="sheetlabel" id="findingsSettingLabel">Findings</span>
        <span class="sheethint" id="findingsSettingHint">A row opens the drawer at the record's chapter.</span>
      </div>
      <span class="doorseg" role="tablist" aria-label="Findings" id="findingsseg">
        <button type="button" data-door="book">In the book</button>
        <button type="button" data-door="quick">Quick read</button>
      </span>
    </div>
    <p class="sheetmeta" id="gearmeta"></p>
  </div>
</div>

<div class="foot">
  <span class="footlinks">
    <a id="footrepo" href="https://github.com/BOGOSbot/mhq-parser" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <a id="footbug" href="https://github.com/BOGOSbot/mhq-parser/issues/new" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="9.6" rx="3.1" ry="3.9"/><path d="M6.4 4.6A1.6 1.6 0 0 1 8 3a1.6 1.6 0 0 1 1.6 1.6v.6H6.4z"/><path d="M4.9 7.4 2.2 6.2M4.7 9.6 1.7 9.4M4.9 11.8 2.3 13.1M11.1 7.4l2.7-1.2M11.3 9.6l3-.2M11.1 11.8l2.6 1.3M6.2 3.4 5.2 2M9.8 3.4 10.8 2"/></svg>
    </a>
    <!-- Missions are the other half of a game night; GD Missions is the reference

var LANG = 'en';
function t(key) {
  var table = I18N[LANG] || I18N.en;
  if (table && table[key] !== undefined) return table[key];
  return I18N.en[key] !== undefined ? I18N.en[key] : key;
}
// --- the growing boxes --------------------------------------------------------
// #q and the translation box #tr are the same widget: a textarea that grows with
// its text and then scrolls, where a one-line input hid the end of a long
// question. Each cap is this page's own and lives in the CSS as max-height, so
// the constant below has to stay in step with the rule it names.
var QCAPPX = 168;   // px, kept in step with textarea#q's CSS max-height
var TRCAPPX = 168;  // px, kept in step with .trbox's CSS max-height
function growBox(box, cap) {
  if (!box) return;
  box.style.height = 'auto';

// --- rendering --------------------------------------------------------------
// The answer is model output, so it is never trusted as HTML. Text becomes text
// nodes, the markers become links to citations this server built, and nothing
// else is interpreted. Bold and italic are the only formatting the model is
// asked for and the only formatting rendered.
function inlineNodes(text, byN) {
  var frag = document.createDocumentFragment();
  var re = /(\*\*[^*]+\*\*|\*[^*]+\*|\[\d+\])/g;
  var last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    var tok = m[0];
    if (tok.charAt(0) === '*') {
      var emph = document.createElement(tok.slice(0, 2) === '**' ? 'b' : 'i');
      emph.textContent = tok.replace(/\*/g, '');
      frag.appendChild(emph);
    } else {
      var n = parseInt(tok.slice(1, -1), 10);
      var c = byN[n];
      if (c) frag.appendChild(citeLink(c, tok));
      else frag.appendChild(document.createTextNode(tok));
    }
    last = m.index + tok.length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

function renderAnswer(text, citations) {
  var byN = {};
  for (var i = 0; i < citations.length; i++) byN[citations[i].n] = citations[i];
  var host = document.createElement('div');
  host.className = 'answer';
  var blocks = String(text || '').split(/\n{2,}/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b].replace(/^\s+|\s+$/g, '');
    if (!block) continue;
    var lines = block.split('\n');
    if (lines[0].indexOf('- ') === 0) {
      var ul = document.createElement('ul');
      for (var j = 0; j < lines.length; j++) {
        var li = document.createElement('li');
        li.appendChild(inlineNodes(lines[j].replace(/^-\s*/, ''), byN));
        ul.appendChild(li);
      }
      host.appendChild(ul);
    } else if (lines[0].charAt(0) === '>') {
      var quote = document.createElement('blockquote');
      var joined = [];
      for (var k = 0; k < lines.length; k++) joined.push(lines[k].replace(/^>\s?/, ''));
      quote.appendChild(inlineNodes(joined.join(' '), byN));
      host.appendChild(quote);
    } else {
      var p = document.createElement('p');
      for (var l = 0; l < lines.length; l++) {
        if (l) p.appendChild(document.createElement('br'));
        p.appendChild(inlineNodes(lines[l], byN));
      }
      host.appendChild(p);
    }
  }
  return host;
}

function translationCard(tr) {
  var ta = document.createElement('textarea');

  // reader corrects a name, not only when the card is first drawn.
  ta.addEventListener('input', growTranslation);
  // The mark in front is a mark, not a control: no click, no target, no name.
  var mark = el('span', 'trmark');
  mark.innerHTML = SEND_ICON;

  var send = el('button', 'sendbtn');
  send.type = 'button';

    if (text.length < 3) { setStatus(t('translationTooShort'), 'err'); return; }
    // task-22: while a run is in flight the correction is queued. Writing #q
    // here was the bug: the reader's French was overwritten and the ask that
    // followed was dropped on ask()'s own busy guard.

// header - not in the results. It is the English the pipeline actually ran, and

// An empty translation draws nothing: a correction box with nothing to correct

function renderTranslation(state) {

// The reader's pick: an ASSERTION that a passage answered the question, written
// into the trace record by the question's random id - not the keep/drop toggle in
// the list, which is a preference about what a second answer should rest on. It
// is a candidate for the test bank and never a label: the server records

//
// The pick is sent only once the run has finished, because the trace it belongs
// to is written after the prose: picking a passage while the answer is still
// being written would name a record that does not exist yet, and the answer path
// must not be reordered to hold it. The last pick made before the run ends is the

function postPick(state) {

    .then(function (out) { state.pickPending = false; state.pickSaved = !(out && out.saved === false); refresh(state); })
