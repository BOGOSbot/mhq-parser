  link.href = f.href || f.url; link.target = '_blank'; link.rel = 'noopener';
  sheet.appendChild(link);
  pop.appendChild(sheet);
  pop.classList.remove('hidden');
}

function closePassage() {
  var pop = document.getElementById('pop');
  if (pop) { pop.classList.add('hidden'); pop.textContent = ''; }
}

// A citation marker opens the popup instead of leaving the page: the passage
// is already in the payload, and the Wahapedia link is one click inside it.
function citeLink(c, label) {
  var a = document.createElement('a');
  a.className = 'cite';
  a.href = c.href || c.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.title = (c.faction ? c.faction + ' - ' : '') + c.heading;
  a.textContent = label;
  a.addEventListener('click', function (ev) { ev.preventDefault(); openPassage(c); });
  return a;
}

// The judge card, drawn from both verdicts. The binding one is always first; the
// second judge is appended under it with its own reasoning setting, so the
// reader can see which verdict gated the prose and which arrived afterwards.
function renderVerdicts(state) {
  var card = state.verdict;
  card.textContent = '';
  if (!state.judge) { card.appendChild(el('div', 'note waiting', t('readingFindings'))); return; }
  // A verdict's passage numbers only mean something against the list it judged:
  // a widening renumbers the findings, so citations are shown only while the
  // verdict and the list on screen are the same pass.
  var samePass = (state.judgeAttempt || 0) === (state.pass || 0);
  card.appendChild(rulingBlock(state.judge, samePass ? state.findings : null));
  if (state.judge2) {
    // task-25: a plain dim sentence, not an uppercase eyebrow. The second judge
    // stays reachable - task-16's cautious-verdict work depends on it.
    var box = document.createElement('details');
    box.className = 'secondv';
    var head = document.createElement('summary');
    head.className = 'secondnote';
    head.textContent = state.judge2.reasoning === 'none' ? t('secondJudgeWithout') : t('secondJudgeWith');
    box.appendChild(head);
    box.appendChild(rulingBlock(state.judge2.judge, null));
    card.appendChild(box);
  }
}

// task-24 (J4): the ruling. The answer is rendered as the slots it has, and the
// verification chrome is gone - no verdict line, no confidence chip, no 'why'
// toggle, no 'passages it rests on'. `why` and `confidence` stay in the payload for
// the trace and the dev panel; the ledger under the ruling is those passages.
// task-25: the display name is the short one - the corpus appends the kind
// (' - keywords and abilities (2/2)', ' - datasheet') and the path line is where the
// kind belongs. One implementation, in the surface; the page asks for it.
function shortName(heading) {
  var api = window.WIKI_SURFACE_API;
  return api && api.shortName ? api.shortName(heading) : String(heading || '');
}
function leafOf(heading) {
  var parts = crumbs(heading);
  return shortName(parts.length ? parts[parts.length - 1] : String(heading || ''));
}
function findFinding(findings, n) {
  for (var i = 0; i < (findings || []).length; i++) if (findings[i].n === n) return findings[i];
  return null;
}
// The source, named BY TITLE - never by its number - with the section path beside it.
// The title opens the same passage popup the [n] markers used to.
function sourceLine(f) {
  var p = el('p', 'rsrc');
  var a = el('a', null, leafOf(f.heading));
  a.href = '#';
  a.addEventListener('click', function (ev) { ev.preventDefault(); openPassage(f); });
  p.appendChild(a);
  var parts = crumbs(f.heading);
  if (parts.length > 1) p.appendChild(el('span', 'srule', parts.slice(0, parts.length - 1).join(' \u203a ')));
  return p;
}
// A figure the cited passages do not carry is struck where it stands, so the reader
// sees which claim failed rather than only that one did.
function strikeFigures(text, bad) {
  var frag = document.createDocumentFragment();
  var tokens = (bad || []).filter(function (b) { return /^\d{2,}$/.test(b); });
  if (!tokens.length) { frag.appendChild(document.createTextNode(text)); return frag; }
  var re = new RegExp('(' + tokens.map(escapeRe).join('|') + ')', 'g');
  var last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    frag.appendChild(el('span', 'rstrike', m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function rulingBlock(judge, findings) {
  var wrap = el('div', 'ruling');
  var answered = !!(judge && judge.answered === true);
  var trace = (judge && judge.trace) || null;
  var answer = judge && judge.answer ? String(judge.answer) : '';
  if (!answer) {
    // FALLBACK: the model failed to write the answer line. The floor is the
    // recommendation - start with the titles - and never an empty block.
    var titles = [];
    for (var i = 0; i < (findings || []).length && titles.length < 3; i++) titles.push(leafOf(findings[i].heading));
    answer = titles.length ? t('rulingStart') + titles.join(', ') : t('noVerdict');
  }
  var line = el('p', 'rline');
  line.appendChild(strikeFigures(answer, trace && trace.bad));
  wrap.appendChild(line);
  // answered:false never renders a quote slot, whatever the payload carries.
  if (answered && judge.quote) {
    var quote = el('blockquote', trace && trace.quoteOk === false ? 'rquote bad' : 'rquote');
    quote.textContent = String(judge.quote);
    wrap.appendChild(quote);
    var src = findFinding(findings, judge.from);
    if (src) wrap.appendChild(sourceLine(src));
  }
  if (answered && judge.exceptions && judge.exceptions.length && findings) {
    var links = [];
    for (var k = 0; k < judge.exceptions.length; k++) {
      var ex = findFinding(findings, judge.exceptions[k]);
      if (!ex) continue;
      var a = el('a', null, leafOf(ex.heading));
      a.href = '#';
      (function (rec) { a.addEventListener('click', function (ev) { ev.preventDefault(); openPassage(rec); }); })(ex);
      links.push(a);
    }
    if (links.length) {
      var p = el('p', 'rex');
      p.appendChild(document.createTextNode(t('rulingUnless') + ' '));
      for (var j = 0; j < links.length; j++) { if (j) p.appendChild(el('span', 'dot', '\u00b7')); p.appendChild(links[j]); }
      wrap.appendChild(p);
    }
  }
  if (!answered && judge && judge.missing) wrap.appendChild(el('p', 'rmiss', String(judge.missing)));
  if (trace && trace.dropped > 0) {
    wrap.appendChild(el('p', 'rtrace', t('rulingTrace').replace('{n}', String(trace.dropped)).replace('{m}', String(trace.total))));
  }
  return wrap;
}

// A datasheet, rendered from the CSV export. Every field below came out of a CSV
// cell through the server's card payload; no model wrote one. The layout is one
// column at every width because this page is mostly read on a phone: the
// statline wraps into chips and the weapons table is fixed-layout so its seven
// columns fit a narrow screen without a horizontal scroll.
function cardStat(label, value, cls) {
  var d = el('div', 'stat' + (cls ? ' ' + cls : ''));
  d.appendChild(el('span', 'k', label));
  d.appendChild(el('span', 'v', value));
  return d;
}

function weaponsTable(rows, melee) {
  var table = el('table', 'uw');
  var hr = el('tr');
  var heads = [t('cardWeapon'), t('cardRange'), t('cardA'), melee ? t('cardWS') : t('cardBS'), t('cardS'), t('cardAP'), t('cardD')];
  for (var i = 0; i < heads.length; i++) hr.appendChild(el('th', null, heads[i]));
  var thead = el('thead');
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = el('tbody');
  for (var r = 0; r < rows.length; r++) {
    var w = rows[r];
    var tr = el('tr');
    var nameCell = el('td', 'wn');
    nameCell.appendChild(el('span', null, w.name));
    if (w.notes) nameCell.appendChild(el('span', 'wnote', w.notes));
    tr.appendChild(nameCell);
    tr.appendChild(el('td', null, w.range));
    tr.appendChild(el('td', null, w.A));
    tr.appendChild(el('td', null, w.BS));
    tr.appendChild(el('td', null, w.S));
    tr.appendChild(el('td', null, w.AP));
    tr.appendChild(el('td', null, w.D));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function kwRow(label, list) {
  var row = el('div', 'ukw');
  if (label) row.appendChild(el('span', 'klabel', label));
  for (var i = 0; i < list.length; i++) row.appendChild(el('span', 'src', list[i]));
  return row;
}

// One ability. A Core or Faction ability is a rule defined elsewhere in the
// corpus and is shown as its title, linked to that record - its body is not
// reprinted on a card about the unit. A Datasheet ability is the unit's own and
// keeps its text. An ability the server could not resolve carries no link and
// falls into the same branch as the datasheet's own: never a dead link.
function abilityBox(ab) {
  var box = el('div', 'uab');
  var head = el('div', 'uabhead');
  var ty = ab.type === 'Core' ? t('cardCore') : ab.type === 'Faction' ? t('cardFaction') : t('cardDatasheet');
  head.appendChild(el('span', 'tag', ty));
  if (ab.link) {
    var a = el('a', 'uabname ulink', ab.name);
    a.href = ab.link.href || ab.link.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = t('cardAbilityLink');
    a.addEventListener('click', function (ev) {
      ev.preventDefault();
      openPassage({ heading: ab.link.heading, passage: ab.link.passage, href: ab.link.href, url: ab.link.url, leg: '' });
    });
    head.appendChild(a);
    box.appendChild(head);
    return box;
  }
  head.appendChild(el('span', 'uabname', ab.name));
  box.appendChild(head);
  box.appendChild(el('p', 'uabtext', ab.description));
  if (ab.truncated) box.appendChild(el('div', 'note', t('cardTruncated')));
  return box;
}

function unitCardView(c) {
  var card = el('div', 'card unitcard');
  card.appendChild(el('h2', null, t('cardTitle')));
  card.appendChild(el('div', 'uname', c.name));
  var sub = el('div', 'usub');
  if (c.faction) sub.appendChild(el('span', 'src', c.faction));
  if (c.role) sub.appendChild(el('span', 'urole', c.role));
  card.appendChild(sub);

  if (c.points && c.points.length) {
    var pts = el('div', 'upoints');
    for (var p = 0; p < c.points.length; p++) {
      pts.appendChild(el('span', 'src', c.points[p].cost + ' ' + t('cardPoints') + (c.points[p].label ? ' - ' + c.points[p].label : '')));
    }
    card.appendChild(pts);
  }

  for (var m = 0; m < (c.models || []).length; m++) {
    var md = c.models[m];
    var block = el('div', 'umodel');
    if ((c.models || []).length > 1 || md.name !== c.name) block.appendChild(el('div', 'umodelname', md.name));
    var strip = el('div', 'ustat');
    strip.appendChild(cardStat(t('cardStatM'), md.M));
    strip.appendChild(cardStat(t('cardStatT'), md.T));
    strip.appendChild(cardStat(t('cardStatSv'), md.Sv));
    if (md.inv) strip.appendChild(cardStat(t('cardStatInv'), md.inv, 'inv'));
    strip.appendChild(cardStat(t('cardStatW'), md.W));
    strip.appendChild(cardStat(t('cardStatLd'), md.Ld));
    strip.appendChild(cardStat(t('cardStatOC'), md.OC));
    block.appendChild(strip);
    if (md.base) block.appendChild(el('div', 'unote', t('cardStatBase') + md.base));
    card.appendChild(block);
  }

  if (c.loadout) card.appendChild(el('div', 'unote', t('cardLoadout') + c.loadout));
  if (c.ranged && c.ranged.length) { card.appendChild(el('h3', null, t('cardRanged'))); card.appendChild(weaponsTable(c.ranged, false)); }
  if (c.melee && c.melee.length) { card.appendChild(el('h3', null, t('cardMelee'))); card.appendChild(weaponsTable(c.melee, true)); }

  if (c.abilities && c.abilities.length) {
    card.appendChild(el('h3', null, t('cardAbilities')));
    for (var a = 0; a < c.abilities.length; a++) card.appendChild(abilityBox(c.abilities[a]));
  }

  var kws = c.keywords || { faction: [], other: [] };
  if (kws.faction.length || kws.other.length) {
    card.appendChild(el('h3', null, t('cardKeywords')));
    if (kws.faction.length) card.appendChild(kwRow(t('cardFactionKeywords') + ':', kws.faction));
    if (kws.other.length) card.appendChild(kwRow(t('cardKeywords') + ':', kws.other));
  }

  if (c.composition && c.composition.length) {
    card.appendChild(el('h3', null, t('cardComposition')));
    for (var co = 0; co < c.composition.length; co++) card.appendChild(el('p', 'uabtext', c.composition[co]));
  }
  if (c.options && c.options.length) {
    card.appendChild(el('h3', null, t('cardOptions')));
    for (var op = 0; op < c.options.length; op++) card.appendChild(el('p', 'uabtext', c.options[op]));
  }
  if (c.damaged) {
    card.appendChild(el('h3', null, t('cardDamaged')));
    card.appendChild(el('p', 'uabtext', (c.damaged.w ? c.damaged.w + ' W - ' : '') + c.damaged.description));
  }

  // The datasheet's own flavour line, from the export, kept small and last: it
  // is not a field a reader checks a rule against.
  if (c.legend) card.appendChild(el('p', 'ulegend', c.legend));

  var foot = el('div', 'unote');
  foot.appendChild(el('div', null, t('cardSourceNote')));
  var src = [];
  if (c.source) src.push(c.source + (c.edition ? ' ' + c.edition + (c.version ? ' v' + c.version : '') : ''));
  if (c.updated) src.push(t('cardUpdated') + String(c.updated).slice(0, 10));
  if (src.length) foot.appendChild(el('div', null, src.join(' - ')));
  if (c.url) {
    var link = el('a', null, t('cardOpen'));
    link.href = c.url; link.target = '_blank'; link.rel = 'noopener';
    foot.appendChild(link);
  }
  card.appendChild(foot);
  return card;
}

// Retrieval is ready in about two seconds and the judge and the prose take
// twenty more, so the page is built up as each piece lands rather than held back
// until the slowest one finishes. Every slot is created up front, so nothing
// moves when a later piece arrives. The judge sits at the top even though it
// arrives last: it says whether the findings below it are worth reading.
// One thumb up, one thumb down, on the answer that is about to arrive. Both are
// tap targets a phone can hit, the POST is fire-and-forget, and a second vote
// replaces the first: one id, one vote, and the server keeps the last one.
function voteRow(id) {
  var rest = document.getElementById('rest');
  if (!rest || rest.querySelector('.vote')) return;
  var row = el('div', 'vote');
  row.appendChild(el('div', 'vq', t('voteHelp')));
  var box = el('div', 'vbtns');
  var made = {};
  ['up', 'down'].forEach(function (v) {
    var b = el('button', 'vbtn');
    b.type = 'button';
    b.textContent = v === 'up' ? t('voteUp') : t('voteDown');
    b.setAttribute('aria-label', v === 'up' ? t('voteUp') : t('voteDown'));
    b.onclick = function () {
      if (made.sent) return;
      made.sent = true;
      if (made[v]) made[v].setAttribute('aria-pressed', 'true');
      if (made[v === 'up' ? 'down' : 'up']) made[v === 'up' ? 'down' : 'up'].removeAttribute('aria-pressed');
      fetch('/rules/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: id, vote: v }) })
        .then(function (r) { return r.json(); })
        .then(function (out) { made.sent = false; if (out && out.saved === false) return; row.querySelector('.vnote').textContent = t('voteThanks'); })
        .catch(function () { made.sent = false; });
    };
    made[v] = b;
    box.appendChild(b);
  });
  row.appendChild(box);
  row.appendChild(el('div', 'vnote', ''));
  rest.appendChild(row);
}

function resultSlots(host, state) {
  // The unit card, when there is one, previews at the very top: it is
  // mechanical and instant, and the pipeline below it still runs.
  var cardSlot = el('div', 'cardslot');
  host.appendChild(cardSlot);
  // task-25: no card and no heading around the ruling.
  var verdict = el('div', 'ruleblock');
  verdict.appendChild(el('div', 'note waiting', t('waitingFindings')));
  host.appendChild(verdict);
  // The findings sit above the prose and carry the top five whole: they are the
  // product and the answer is an addition to them, so the prose reads as what it
  // is - a summary of passages already on the page.
  var findingSlot = el('div', 'findingsslot');
  host.appendChild(findingSlot);
  // No answer card: the writer is off by default and the page must not wait on
  // prose that is not coming. The findings, the verdict, the citations and the
  // marks are the page - see writerEnabled in src/rules-corpus.mjs.
  var rest = el('div');
  host.appendChild(rest);
  state.cardSlot = cardSlot; state.verdict = verdict; state.findingSlot = findingSlot; state.rest = rest;
  return state;
}

function newState() {
  return { findings: [], counts: null, cited: [], pass: 0, terms: [], translation: null, card: false, judge: null, judge2: null, judgeAttempt: 0, disputed: false, events: 0, answered: false,
    // The manual rerank: what the reader asked, the English the pipeline ran,
    // the trace the first answer saved, the ids on screen and which of them the
    // reader is keeping. Only the first answer is selectable.
    question: '', asked: '', traceId: '', shownIds: [], keep: {}, selectable: false, rerun: false,
    // The one rerank ordering the reader controls: the ids they careted, newest
    // first, and which records they opened the dev view on. Both survive a
    // re-render; the caret and the x are also the trace's labelled examples, so
    // they are posted the moment they are made and held server-side until it lands.
    positive: [], devOpen: {}, labelsTouched: false,
    // The full-screen record: which finding is open, the structured card once it
    // has landed, the wiki page for it, and the per-record caches so a swipe back
    // to a record already opened costs no request.
    recordId: '', recordData: null, recordWiki: '', recordCache: null, recordWikiMap: null,
    // The reader's pick - a record id, or 'none' - and whether it has landed.
    // It is sent only once the run has finished writing its trace, so a pick made
    // while the prose is still being written is not lost to a record that does not
    // exist yet; runDone is that boundary, and it is not the answer path.
    pick: '', pickSaved: undefined, pickPending: false, runDone: false };
}

function startResult(lang, options) {
  var o = options || {};
  resetProgress();
  var host = $('#result');
  if (o.append) {
    // A second answer to the same question, on the passages the reader chose. It
    // is appended, never replacing the first: the reader may already have read
    // that one, which is the rule the second judge set.
    var wrap = el('div', 'rerun');
    var title = sectionCard(t('rerunTitle'));
    title.appendChild(el('div', 'note', t('rerunNote')));
    wrap.appendChild(title);
    host.appendChild(wrap);
    var state = resultSlots(wrap, newState());
    state.rerun = true;
    return state;
  }
  host.textContent = '';
  host.classList.remove('hidden');
  $('#intro').classList.add('hidden');
  clearTranslation();
  return resultSlots(host, newState());
}

// --- stage progress ---------------------------------------------------------
// The bar is built from the stage list the server sends with its first event and
// advanced by the events that follow: findings means retrieval finished, judge
// means the verdict finished. Nothing here estimates - a segment lights because
// that stage actually reported back.
//
// Each segment also carries what its stage cost. The clock is the server's own
// elapsedMs, which every event reports, so a segment shows how long that stage
// really took rather than what the browser saw of it. The bar is the record of
// the request, not a spinner: when the answer lands it stays on the page with
// its timings, and the status line stops repeating what is already here.
var PSTAGE_MS = {};
var PSTAGE_AT = 0;   // the elapsedMs of the last stage boundary
var PDONE = false;   // the run ended; the counter beside the bar stops moving

function pFmt(ms) { return (ms / 1000).toFixed(1) + 's'; }

// Credit everything since the last boundary to one stage and repaint it. Called
// at each boundary the server reports, so a stage that ran twice - the judge,
// before and after a widening - accumulates instead of overwriting.
function pAttribute(name, elapsedMs) {
  var at = Number(elapsedMs);
  if (!isFinite(at)) at = 0;
  var spent = at - PSTAGE_AT;
  if (spent < 0) spent = 0;
  // A stage with nothing credited yet is painted even when it cost nothing this
  // boundary: the writer's refusal is reported by the judge and the answer in
  // the same millisecond, and an empty box reads as a stage that never ran.
  if (spent > 0 || PSTAGE_MS[name] === undefined) {
    PSTAGE_MS[name] = (PSTAGE_MS[name] || 0) + spent;
    if (at > PSTAGE_AT) PSTAGE_AT = at;
  }
  pPaint(name);
}

function pPaint(name) {
  var seg = document.querySelector('.pseg[data-stage="' + name + '"]');
  if (!seg) return;
  var ms = PSTAGE_MS[name];
  if (ms === undefined) return;
  var time = seg.querySelector('em');
  if (time) time.textContent = pFmt(ms);
}

// The label, the time that will appear beside it, and the fill behind both.
function pSegment(name, active) {
  var seg = el('div', active ? 'pseg active' : 'pseg');
  seg.setAttribute('data-stage', name);
  seg.appendChild(el('span', null, stageLabel(name)));
  seg.appendChild(el('em'));
  seg.appendChild(el('div', 'pfill'));
  return seg;
}

function startProgress(stages) {
  var host = $('#progress');
  var box = $('#psegs');
  if (!host || !box) return;
  box.textContent = '';
  PSTAGE_MS = {};
  PSTAGE_AT = 0;
  PDONE = false;
  for (var i = 0; i < (stages || []).length; i++) box.appendChild(pSegment(stages[i], false));
  host.classList.remove('hidden');
  activateNext();
}

// A new question starts from a blank bar: the previous request's timings must
// not sit under the new question while it is still being asked.
function resetProgress() {
  var host = $('#progress');
  var box = $('#psegs');
  if (box) box.textContent = '';
  if (host) host.classList.add('hidden');
  var e = $('#pelapsed');
  if (e) e.textContent = '';
  PSTAGE_MS = {};
  PSTAGE_AT = 0;
  PDONE = false;
}

function activateNext() {
  var segs = $('#psegs').children;
  for (var i = 0; i < segs.length; i++) {
    if (segs[i].className.indexOf('done') === -1) { segs[i].className = 'pseg active'; return; }
  }
}

function setStageActive(name) {
  var seg = document.querySelector('.pseg[data-stage="' + name + '"]');
  if (seg && seg.className.indexOf('done') === -1) seg.className = 'pseg active';
}

// Added when the judge sends the search back for a wider look, so the bar shows
// the extra pass instead of quietly re-lighting a finished stage. Only the stage
// actually running shimmers: the widening takes over from the judge, which is
// still waiting to re-read the wider findings.
function addStage(name, afterName) {
  var box = $('#psegs');
  if (!box || box.querySelector('.pseg[data-stage="' + name + '"]')) return;
  var running = box.querySelectorAll('.pseg.active');
  for (var a = 0; a < running.length; a++) running[a].className = 'pseg';
  var seg = pSegment(name, true);
  var after = afterName ? box.querySelector('.pseg[data-stage="' + afterName + '"]') : null;
  if (after && after.nextSibling) box.insertBefore(seg, after.nextSibling);
  else box.appendChild(seg);
}

function markStage(name) {
  var seg = document.querySelector('.pseg[data-stage="' + name + '"]');
  if (seg) seg.className = 'pseg done';
  activateNext();
}

// One stage landed: credit its time, then close it.
function doneStage(name, elapsedMs) {
  pAttribute(name, elapsedMs);
  markStage(name);
}

function finishProgress() {
  var segs = $('#psegs').children;
  for (var i = 0; i < segs.length; i++) segs[i].className = 'pseg done';
  var e = $('#pelapsed');
  if (e) e.textContent = '';
  PDONE = true;
}

function flash(node) {
  node.classList.remove('arrived');
  void node.offsetWidth;   // restart the animation on a node being reused
  node.classList.add('arrived');
}

function applyEvent(ev, state) {
  if (!ev || !ev.type) return;
  state.events = (state.events || 0) + 1;
  if (ev.type === 'start') {
    startProgress(ev.stages);
    // The thumb. It is drawn here, before the answer exists, so it can never
    // delay or block the answer - and it is the only use of the trace id. When
    // the trace is off the server sends no id and the page shows no vote: the
    // vote is a bonus on top of a saved trace, never a store of its own.
    if (ev.traceId) voteRow(ev.traceId);
    if (ev.traceId) state.traceId = ev.traceId;
    return;
  }
  // The server echoes the setting it actually ran, which is also what a shared
  // link or a curl says: the page draws it from its own toggle, so this only
  // keeps the state honest if the two ever disagree.
  if (ev.type === 'mode') { state.mode = ev.mode; return; }
  if (ev.type === 'card') {
    // Additive, never instead of the search: the judge, the findings and the
    // prose still run, so their slots stay where they are and the card takes the
    // top of the result. It is instant, and that is the point - something to
    // read while the pipeline works.
    state.card = true;
    state.cardSlot.textContent = '';
    state.cardSlot.appendChild(unitCardView(ev.card));
    flash(state.cardSlot);
    setStatus(t('cardReady'), 'busy');
    return;
  }
  if (ev.type === 'escalate') { pAttribute('judge', ev.elapsedMs); addStage('widen', 'retrieve'); return; }
  if (ev.type === 'translation') { state.translation = ev; renderTranslation(state); doneStage('translate', ev.elapsedMs); return; }
  if (ev.type === 'terms') {
    state.terms = ev.terms || [];
    if (ev.translated) state.asked = ev.translated;
    doneStage('translate', ev.elapsedMs);
    return;
  }
  if (ev.type === 'findings') {
    state.findings = ev.findings || [];
    // The rerank selection starts as "everything the server sent", and the ids
    // are kept in the order the server sent them so the rerun's request order is
    // the order the reader is looking at. A widening re-emits the whole list, so
    // the reader's own marks are carried over for the ids that survive it - an x
    // or a caret must not be undone by a second pass.
    var prevKeep = state.keep || {};
    var prevPositive = state.positive || [];
    state.shownIds = [];
    state.keep = {};
    state.positive = [];
    for (var si = 0; si < state.findings.length; si++) {
      var sid = state.findings[si].id;
      if (typeof sid === 'string' && sid) {
        state.shownIds.push(sid);
        state.keep[sid] = prevKeep[sid] !== false;
        if (prevPositive.indexOf(sid) !== -1) state.positive.push(sid);
      }
    }
    state.counts = ev.counts || null;
    state.pass = ev.attempt || 0;
    // A widening renumbers the findings, so the verdict that judged the previous
    // list can no longer name them: its citations are dropped until the new
    // verdict reports its own, rather than pointing at the wrong passages.
    if (ev.attempt > 0) state.cited = [];
    state.terms = (ev.terms && ev.terms.length) ? ev.terms : state.terms;
    state.rest.textContent = '';
    if (state.terms.length) state.rest.appendChild(termsCard(state.terms));
    // Re-rendered on every pass, so a widened search replaces the narrower list
    // rather than leaving one list under the other, and the open record with it.
    refresh(state);
    if (ev.attempt > 0) flash(state.findingSlot);
    doneStage(ev.attempt > 0 ? 'widen' : 'retrieve', ev.elapsedMs);
    if (ev.attempt > 0) setStageActive('judge');
    // The judge is computed from the findings, so once they are here the
    // placeholder should say what it is actually waiting on.
    var vwait = state.verdict.querySelector('.waiting');
    if (vwait) vwait.textContent = t('readingFindings');
    setStatus(state.findings.length
      ? t('findingsReady') + (ev.elapsedMs / 1000).toFixed(1) + t('judgeComing')
      : t('nothingMatched'),
      state.findings.length ? 'busy' : 'warn');
    return;
  }
  if (ev.type === 'judge') {
    // Two verdicts, two slots. The second is never allowed to overwrite the
    // first: it is a second opinion, and the reader is owed both.
    if (ev.second) state.judge2 = { judge: ev.judge, reasoning: ev.reasoning || '' };
    else {
      state.judge = ev.judge;
      state.judgeAttempt = ev.attempt || 0;
      // The verdict names the passages it rests on. They are promoted out of the
      // collapse and badged, so the evidence behind a verdict is never hidden in
      // the collapsed remainder.
      state.cited = Array.isArray(ev.judge && ev.judge.passages) ? ev.judge.passages.slice() : [];
      if (state.findings.length) refresh(state);
    }
    renderVerdicts(state);
    flash(state.verdict);
    // Only a final verdict closes the judge stage; an interim one is about to be
    // superseded, so closing it would show progress that has not happened.
    if (ev.final !== false) doneStage('judge', ev.elapsedMs);
    else setStageActive('judge');
    // The status line keeps the binding verdict's wording; the second judge is
    // reported in the card and, when it disagrees, in the annotation.
    if (ev.second) return;
    var no = ev.judge && ev.judge.answered === false;
    setStatus(t('judgeIn') + (ev.elapsedMs / 1000).toFixed(1) + 's - ' + (no ? t('judgeNo') : t('judgeYes')), no ? 'warn' : 'ok');
    return;
  }
  if (ev.type === 'reconcile') {
    // The prose was written before this verdict landed and may already have been
    // read, so the contradiction is annotated on top of it - never a silent
    // replacement. Two outcomes, and the difference is the point: a dissent from
    // a judge at least as reliable as the one that answered downgrades the answer
    // ('not confirmed'); a WEAKER judge's refusal is a dissent and leaves the
    // answer standing, because the less accurate judge must not veto the more
    // accurate one - reasoning off measured 61.8% against reasoning on 79.4%.
    var down = ev.downgrade === true;
    state.disputed = down;
    var box = el('div', down ? 'dispute' : 'dissent');
    box.appendChild(el('div', 'dtitle', down ? t('judgeDisagreeTitle') : t('judgeDissentTitle')));
    box.appendChild(el('div', 'note', down
      ? (ev.conservative === 'second' ? t('judgeDisagreeNo') : t('judgeDisagreeYes'))
      : (ev.dissenter === 'second' ? t('judgeDissentWeaker') : t('judgeDissentOther'))));
    state.rest.appendChild(box);
    flash(state.rest);
    setStatus(down ? t('judgeDisagreeTitle') : '', down ? 'warn' : '');
    return;
  }
  // No 'answer' event is handled: the writer is off, the server does not send one
  // and there is nothing on the page to show it in.
  if (ev.type === 'done') {
    finishProgress();
    // The trace exists by now, so a pick made while the prose was still being
    // written can land in its record; a later pick posts straight away. The marks
    // are not here on purpose: they were posted when they were made, and the
    // server held them for this moment.
    state.runDone = true;
    if (state.pickPending) postPick(state);
    // A disagreement outlives the request: clearing it here would erase the one
    // line that says the answer is provisional.
    if (state.disputed) { setStatus(t('judgeDisagreeTitle'), 'warn'); return; }
    var pending = state.verdict.querySelector('.waiting');
    // A finished request says nothing here: the timings are in the bar and the
    // count is the findings card's own title. A stream that ended without a part
    // is the one thing the bar cannot show, so that one is still said.
    setStatus(pending ? t('partMissing') : '', pending ? 'warn' : '');
    return;
  }
  // The provider's raw string is for the log, not the reader.
  if (ev.type === 'error') { try { console.error(ev.message); } catch (e) { /* no console */ } setStatus(t('requestFailed'), 'err'); }
}

// The whole response at once, for anything that cannot stream.
function showInto(state, j) {
  // The stream sends the translation as an event and the JSON reply carries it as
  // a string: one box, filled from whichever arrived. Only when the server really
  // translated - a rerun's reply echoes the English it was given.
  if (j.translation && j.translation !== (j.question || '')) applyEvent({ type: 'translation', detected: j.lang, translated: j.translation, elapsedMs: j.elapsedMs }, state);
  if (j.card) applyEvent({ type: 'card', card: j.card, elapsedMs: j.elapsedMs }, state);
  applyEvent({ type: 'findings', findings: j.findings || [], counts: j.counts, terms: j.terms, steps: j.steps, elapsedMs: j.elapsedMs }, state);
  if (j.judge) applyEvent({ type: 'judge', judge: j.judge, final: true, elapsedMs: j.elapsedMs }, state);
  applyEvent({ type: 'answer', answer: j.answer, elapsedMs: j.elapsedMs }, state);
  applyEvent({ type: 'done', elapsedMs: j.elapsedMs, unresolved: j.unresolved, escalated: j.escalated }, state);
  for (var i = 0; i < (j.notes || []).length; i++) state.rest.appendChild(el('div', 'note warn', j.notes[i]));
}

// A whole response when there was no state yet.
function show(j) { showInto(startResult(j.lang), j); }
// --- when was this copy of the rules built? ---------------------------------
// The date our own corpus was made, taken from the corpus itself. Deliberately
// not a verdict on whether some other site is behind: that compares clocks
// dating different things and can only answer coarsely, while our own build date
// is exact and is the one that says whether this copy is worth trusting.
(function corpusDate() {
  if (!document.getElementById('footdata')) return;
  fetch('/health').then(function (r) { return r.json(); }).then(function (h) {
    var c = h && h.corpus;
    if (!c || !c.updated) return;
    var at = new Date(c.updated);
    if (isNaN(at.getTime())) return;
    FOOT = { date: String(c.updated).slice(0, 10), days: Math.floor((Date.now() - at.getTime()) / 86400000) };
    renderFoot();
  }).catch(function () { /* the line is optional */ });
})();

// --- voice ------------------------------------------------------------------
// Two recognisers, one microphone. The browser's Web Speech API is free and fine
// in conversation, but it has no glossary - on rules and unit names it writes
// whatever sounds closest (Tyrannofex -> Tyranofex, Archon -> arcon). The measured
// route is server-side Gemini 2.5 Flash with the 40k glossary as a cached system
// prefix: 78.9% terminology accuracy against 44.7% without, $0.0011 for an 8.7 s
// clip once the prefix is cached. Mandal's call: Gemini is the default, the
// browser recogniser stays as the setting and as the fallback path.
//
// MediaRecorder records the clip; the browser decodes it and re-encodes 16 kHz
// mono WAV (the format every provider accepts), then posts it to /rules/voice.
// The transcript is put in the box and NEVER submitted: recognition still mangles
// names, so the reader corrects the text before asking. A server failure falls
// back to the browser recogniser rather than leaving a dead microphone.
// 16 kHz mono 16-bit WAV from whatever the recorder produced.
function encodeWav16(samples, inRate) {
  var outRate = 16000;
  var n = Math.max(1, Math.round(samples.length * outRate / inRate));
  var pcm = new Int16Array(n);
  for (var i = 0; i < n; i++) {
    var pos = i * inRate / outRate, i0 = Math.floor(pos), f = pos - i0;
    var s = (samples[i0] || 0) * (1 - f) + (samples[i0 + 1] || samples[i0] || 0) * f;
    s = Math.max(-1, Math.min(1, s));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  var buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  function tag(off, s) { for (var k = 0; k < s.length; k++) v.setUint8(off + k, s.charCodeAt(k)); }
  tag(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); tag(8, 'WAVE');
  tag(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, outRate, true); v.setUint32(28, outRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  tag(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (var j = 0; j < pcm.length; j++) v.setInt16(44 + j * 2, pcm[j], true);
  return new Blob([buf], { type: 'audio/wav' });
}
function blobToWav(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    return new Ctx().decodeAudioData(buf);
  }).then(function (audio) {
    var ch = audio.numberOfChannels, len = audio.length, mono = new Float32Array(len);
    for (var c = 0; c < ch; c++) { var d = audio.getChannelData(c); for (var i = 0; i < len; i++) mono[i] += d[i] / ch; }
    return { wav: encodeWav16(mono, audio.sampleRate), seconds: audio.duration || (len / (audio.sampleRate || 1)) };
  });
}

function wireVoice(mic, box, locale, grow) {
  if (!mic || !box) return;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, recorder = null, stream = null, chunks = [], timer = null, ticker = null;
  var listening = false, recording = false;
  var recordAt = 0;
  var base = '';
  // Clips are one or two sentences, not conversations: the mic stops itself at
  // 20 s, and the status counts up so the reader can see it coming.
  var MAX_RECORD_MS = 20000;
  // Each control restores its own name when it stops, so the translation's
  // microphone does not come back called "Ask by voice".
  var idleLabel = mic.getAttribute('aria-label') || t('voice');

  function setListening(on) {
    listening = on;
    mic.classList.toggle('on', on || recording);
    mic.title = on || recording ? t('stopListening') : idleLabel;
    if (on) setStatus(t('listening'), 'busy');
  }
  function setRecording(on) {
    recording = on;
    mic.classList.toggle('on', on || listening);
    mic.title = on || listening ? t('stopListening') : idleLabel;
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (on) {
      recordAt = Date.now();
      var counter = function () {
        var secs = Math.floor((Date.now() - recordAt) / 1000);
        setStatus(t('voiceRecordingSec').replace('{n}', String(secs)), 'busy');
      };
      counter();
      ticker = setInterval(counter, 500);
    }
  }
  function putTranscript(text) {
    var said = String(text || '').replace(/\s+/g, ' ').trim();
    if (!said) { setStatus(t('nothingHeard'), 'err'); return; }
    base = box.value.trim();
    box.value = (base ? base + ' ' : '') + said;
    grow();
    setStatus(t('heard'), '');
  }

  // The browser recogniser: the old path, kept as the fallback and as a setting.
  function browserStart() {
    if (!SR) { setStatus(t('voiceUnsupported'), 'err'); return; }
    if (listening) return;
    rec = new SR();
    rec.lang = locale();
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    base = box.value.trim();
    rec.onresult = function (e) {
      var text = '';
      for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      box.value = (base ? base + ' ' : '') + text.trim();
      grow();
      setStatus(e.results[e.results.length - 1].isFinal ? t('heard') : t('listening'), 'busy');
    };
    rec.onerror = function (e) {
      var why = e.error === 'not-allowed' ? t('micRefused')
        : e.error === 'no-speech' ? t('nothingHeard')
        : e.error === 'audio-capture' ? t('noMic')
        : e.error === 'network' ? t('speechNet')
        : t('voiceFailed') + e.error;
      setStatus(why, 'err');
      setListening(false);
    };
    rec.onend = function () {
      if (listening) setStatus(box.value ? t('heard') : t('nothingHeard'), '');
      setListening(false);
    };
    try { rec.start(); setListening(true); }
    catch (e) { setStatus(t('voiceNoStart') + e.message, 'err'); }
  }
  function browserStop() {
    if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } }
    setListening(false);
  }

  // The server recogniser: record, encode, post, put the transcript in the box.
  // A failure after the microphone opened lands on the browser path.
  function fallbackBrowser() {
    if (!SR) { setStatus(t('voiceUnsupported'), 'err'); return; }
    setStatus(t('voiceFallback'), 'err');
    browserStart();
  }
  function postVoice(wav, seconds) {
    // The clip's length rides the request: the route's completeness guard needs
    // it to know what "too few words" means for this audio.
    return fetch('/rules/voice', { method: 'POST', headers: { 'Content-Type': 'audio/wav', 'X-Audio-Seconds': String(Math.max(0, Number(seconds) || 0).toFixed(1)) }, body: wav })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || !j || !j.text) throw new Error((j && j.error) || ('HTTP ' + r.status));
          return j;
        });
      })
      .then(function (j) { putTranscript(j.text); })
      .catch(function (e) { console.warn('voice route failed: ' + (e && e.message ? e.message : e)); fallbackBrowser(); });
  }
  function geminiStart() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { fallbackBrowser(); return; }
    navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } }).then(function (s) {
      stream = s;
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        setRecording(false);
        if (timer) { clearTimeout(timer); timer = null; }
        if (ticker) { clearInterval(ticker); ticker = null; }
        if (stream) { stream.getTracks().forEach(function (tr) { try { tr.stop(); } catch (e) { } }); stream = null; }
        var blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || 'audio/webm' });
        if (!blob.size) { setStatus(t('nothingHeard'), 'err'); return; }
        setStatus(t('voiceTranscribing'), 'busy');
        blobToWav(blob).then(function (out) { return postVoice(out.wav, out.seconds); }).catch(function (e) { console.warn('voice clip decode failed: ' + e.message); fallbackBrowser(); });
      };
      recorder.start();
      setRecording(true);
      timer = setTimeout(function () { if (recording) { try { recorder.stop(); } catch (e) { } } }, MAX_RECORD_MS);
    }).catch(function (e) {
      setStatus(e && e.name === 'NotAllowedError' ? t('micRefused') : t('noMic'), 'err');
    });
  }
  function stopRecording() {
    if (timer) { clearTimeout(timer); timer = null; }
    try { recorder.stop(); } catch (e) { setRecording(false); }
  }

  mic.addEventListener('click', function () {
    if (recording) { stopRecording(); return; }
    if (listening) { browserStop(); return; }
    if (voiceEngine() === 'gemini') geminiStart(); else browserStart();
  });
}

// The question's microphone listens in the language the page is in: one switch.
wireVoice(document.getElementById('mic'), document.getElementById('q'), function () {
  return LANG === 'fr' ? 'fr-FR' : 'en-GB';
}, growQuestion);

// --- asking -----------------------------------------------------------------
var busy = false;
// task-22: a corrected translation clicked while a run is in flight is QUEUED,
// not pasted into #q and dropped. One slot: a second click replaces the first.
// It is launched from ask()'s finally, once the current run has really finished,
// and #q is not touched until that launch (the reader's own question stays in
// the box while the first run is still answering).
var PENDING = null;

function paintQueued() {
  var slot = $('#trslot');
  var row = document.querySelector('.trrow');
  if (row) row.classList.toggle('queued', !!PENDING);
  var note = document.getElementById('trqueue');
  if (PENDING) {
    if (!note) {
      note = el('div', 'trqueue');
      note.id = 'trqueue';
      if (slot) slot.appendChild(note);
    }
    note.textContent = t('correctionQueuedCard');
  } else if (note && note.parentNode) {
    note.parentNode.removeChild(note);
  }
}

function queueCorrection(question) {
  PENDING = { question: question, english: true };
  paintQueued();
  setStatus(t('correctionQueued'), 'busy');
}

// ask() takes overrides from the translation card: the corrected English text
// and the fact that it is already English, so the server neither detects nor
// translates it again.
// A lookup by name is answered before the pipeline: the server greps the
// corpus's own headings and returns the record, and the record view opens on it.
// It fires when the reader asks - on Enter or the send button - and never as they
// type: a card opening mid-word answers a question nobody has asked yet.
// A miss is invisible here - the normal ask runs untouched - because the reader
// asked for a rule, not for a router. The marks (caret, x) are hidden: there is
// no question for them to label, and the record is the whole answer.
async function lookupAnswer(question) {
  var out = null;
  try {
    var r = await fetch('/rules/lookup?q=' + encodeURIComponent(question));
    out = r.ok ? await r.json() : null;
  } catch (e) { out = null; }
  if (!out || !out.found || !out.record) return false;
  var state = newState();
  state.selectable = false;
  state.rerun = true;
  state.findings = [out.record];
  state.recordWikiMap = {};
  state.recordWikiMap[out.record.id] = out.wiki || '';
  openRecord(state, out.record.id);
  setStatus(t('lookupFound'), 'ok');
  return true;
}

async function ask(over) {
  if (busy) return;
  var o = over || {};
  var question = (o.question != null ? String(o.question) : $('#q').value).trim();
  if (question.length < 3) { setStatus(t('statusAskFirst'), 'err'); return; }
  // A lookup by name is answered from the heading index before any model runs;
  // a miss - or anything that is not a lookup - falls through to the pipeline
  // below, untouched. A rerun and a corrected translation are never lookups.
  if (!o.keep && !o.english && await lookupAnswer(question)) return;
  busy = true;
  var btn = $('#go');
  btn.disabled = true;
  var t0 = performance.now();
  // A cold question reads real pages and takes ten to thirty seconds. A frozen
  // button over a still line reads as broken, so the status counts.
  // The bar carries the progress now, so this only counts seconds beside it.
  setStatus('', '');
  var tick = setInterval(function () {
    if (PDONE) return;
    var e = $('#pelapsed');
    if (e) e.textContent = ((performance.now() - t0) / 1000).toFixed(0) + 's';
  }, 200);
  try {
    // Draw the slots before the request, so pressing Ask shows where the parts
    // will land instead of an empty page while translation runs.
    // The answer is written in the language of the page switch, whatever
    // language the question arrived in: French question under the FR switch gets
    // a French answer, and an English question does too.
    var answerLang = LANG;
    var state = startResult(answerLang, { append: o.append === true });
    state.question = question;
    state.selectable = o.append !== true;
    var r = await fetch('/rules/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: question,
        answerLang: answerLang,
        english: o.asked ? true : o.english === true,
        mode: MODE,
        stream: true,
        // A manual rerank: the ids to keep, the ids that were on screen, the
        // English question the reader already read, and the trace of the first
        // answer. Ids only - the server resolves them against its own corpus.
        keep: Array.isArray(o.keep) ? o.keep : undefined,
        shown: Array.isArray(o.shown) ? o.shown : undefined,
        asked: o.asked || undefined,
        over: o.over || undefined
      })
    });
    if (!r.ok) {
      var errBody = await r.json().catch(function () { return {}; });
      throw new Error(errBody.error || ('HTTP ' + r.status));
    }
    if (!r.body || !r.body.getReader || !window.TextDecoder) {
      // No readable stream in this browser: take the whole response instead.
      showInto(state, await r.json());
      return;
    }
    // One JSON object per line, applied as each line arrives. The findings are
    // on screen about two seconds in; the judge and the prose follow behind.
    var reader = r.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        var ev = null;
        try { ev = JSON.parse(lines[i]); } catch (e2) { continue; }
        applyEvent(ev, state);
      }
    }
  } catch (e) {
    // A stream can be cut mid-answer - the browser reports it as 'Error in input
    // stream', which is what a response that never sent its last event looks like
    // from here. What arrived is kept and the bar keeps its timings: the findings
    // are the product, and replacing them with a raw browser string is the one
    // thing not to do. The real error goes to the console with how far it got.
    try { console.error('rules/ask stream ended early after ' + (state.events || 0) + ' events: ' + (e && e.message ? e.message : e)); } catch (e2) { /* no console */ }
    finishProgress();
    setStatus(state.answered ? t('streamCut') : String((e && e.message) || e), 'err');
  } finally {
    clearInterval(tick);
    busy = false;
    btn.disabled = false;
    // task-22: the run is over, so a queued correction can search now. It is
    // taken before ask() so a second click during THIS launch still queues
    // against the new run rather than being lost.
    var queued = PENDING;
    PENDING = null;
    paintQueued();
    if (queued) {
      $('#q').value = queued.question;
      growQuestion();
      ask({ question: queued.question, english: queued.english === true });
    }
  }
}

$('#f').addEventListener('submit', function (e) { e.preventDefault(); ask(); });

// The wiki page's box submits to /rules?q=...: one ask implementation, two
// surfaces. The reader types the question on the record page and it runs here.
(function askFromQuery() {
  var m = /[?&]q=([^&]*)/.exec(location.search);
  if (!m) return;
  var text = decodeURIComponent(m[1].replace(/\+/g, ' ')).trim();
  if (text.length < 3) return;
  var box = $('#q');
  if (!box) return;
  box.value = text;
  growQuestion();
  ask();
})();
document.addEventListener('keydown', function (e) {
  var inRecord = !!(RECORD_STATE && RECORD_STATE.recordId);
  if (e.key === 'Escape') {
    var gear = gearSheet();
    if (gear && gear.classList.contains('open')) { closeSettings(); return; }
    if (FSHEET && !FSHEET.pop.classList.contains('hidden')) { closeFindingSheet(); return; }
    if (inRecord) { closeRecord(RECORD_STATE); return; }
    closePassage(); $('#q').blur();
    return;
  }
  // The record walks the findings with the arrow keys the same way a swipe does.
  if (inRecord && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    recordStep(RECORD_STATE, e.key === 'ArrowRight' ? 1 : -1);
  }
});
growQuestion();
// Desktop convenience only: focusing a textarea on a phone opens the keyboard
// over the page before the reader has decided to ask anything.
if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) $('#q').focus();
</script>
