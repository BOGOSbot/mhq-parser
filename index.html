<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHQ Army Lists</title>
<style>
:root{
  --bg:#0f1116; --panel:#161a22; --panel2:#1c212b; --line:#2a3040;
  --txt:#e7eaf0; --dim:#8d96a8; --acc:#6ea8fe; --warn:#e8b44a; --err:#ef6b6b; --ok:#5fbf7f;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,22,.94);
  border-bottom:1px solid var(--line);padding:12px 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.2px;white-space:nowrap}
h1 span{color:var(--dim);font-weight:400}
form{display:flex;gap:8px;flex:1;min-width:300px;align-items:center}
input[type=url],input[type=search]{background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px}
input[type=url]{flex:1;min-width:200px;font:13px var(--mono)}
input[type=url]:focus,input[type=search]:focus{outline:none;border-color:var(--acc)}
button{background:var(--acc);color:#0b1020;border:0;border-radius:7px;padding:8px 16px;
  font:600 13px system-ui;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
  padding:6px 11px;font-weight:500}
button.ghost:hover{color:var(--txt);border-color:var(--acc);filter:none}
.status{font:12px var(--mono);color:var(--dim);min-height:16px;margin-top:9px}
.status.err{color:var(--err)}
.status.busy{color:var(--acc)}
.status.ok{color:var(--ok)}
main{padding:16px 18px 70px;max-width:1240px;margin:0 auto}
.empty{color:var(--dim);text-align:center;padding:80px 12px;font-size:14px}
.empty code{font:12.5px var(--mono);color:var(--txt);background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.ev{font-weight:600;font-size:14.5px}
.bar .meta{color:var(--dim);font:12px var(--mono);margin-top:2px}
.spacer{flex:1}
input[type=search]{width:230px;font:13px system-ui}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:7px 8px;font:13px system-ui;max-width:250px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px;
  cursor:pointer;user-select:none;white-space:nowrap}
label.chk input{accent-color:var(--acc)}
.shown{color:var(--dim);font:12px var(--mono);white-space:nowrap}
.tblock{margin:20px 0 4px}
.team{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;padding-bottom:5px;
  border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px;overflow-wrap:anywhere}
.team b{color:var(--txt);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;min-width:0}
.card.has-warn{border-color:rgba(232,180,74,.55)}
.card h3{margin:0 0 2px;font-size:14.5px;overflow-wrap:anywhere}
.badge{display:inline-block;font:11px/1 var(--mono);padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);margin:6px 0 0}
.badge.ok{color:var(--ok);border-color:rgba(95,191,127,.55)}
.badge.bad{color:var(--err);border-color:rgba(239,107,107,.55)}
.badge.warn{color:var(--warn);border-color:rgba(232,180,74,.55)}
.faction{color:var(--dim);font-size:12px;margin-bottom:9px;overflow-wrap:anywhere}
.points{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.points .big{font:600 18px var(--mono)}
.points .cmp{font:12px var(--mono);color:var(--dim)}
.points .cmp.bad{color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{font:11.5px var(--mono);color:var(--warn);background:rgba(232,180,74,.1);
  border:1px solid rgba(232,180,74,.35);border-radius:20px;padding:2px 9px}
.meta-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;
  margin:0 0 9px}
.meta-grid dt{color:var(--dim)}
.meta-grid dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.units{display:flex;flex-direction:column;gap:1px}
.unit{display:flex;gap:8px;align-items:baseline;padding:4px 0;
  border-top:1px solid rgba(42,48,64,.55)}
.unit:first-child{border-top:0}
.unit .m{flex:1;font-size:13px;min-width:0}
.unit .m b{font-weight:600}
.unit .m small{display:block;color:var(--dim);font-size:11.5px;line-height:1.4;
  margin-top:1px;overflow-wrap:anywhere}
.unit .p{font:600 12.5px var(--mono);white-space:nowrap}
.unit .p.zero{color:var(--dim);font-weight:400}
details{margin-top:11px}
details summary{color:var(--dim);font:12px var(--mono);cursor:pointer}
details summary:hover{color:var(--txt)}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:10px;overflow:auto;font:11.5px/1.55 var(--mono);max-height:300px;margin:8px 0 0}
details.mini pre{max-height:360px;white-space:pre-wrap}
a.ext{color:var(--acc);font:12px system-ui;text-decoration:none;white-space:nowrap;
  margin-left:4px;padding:2px 5px;border-radius:5px}
a.ext:hover{text-decoration:underline;background:rgba(110,168,254,.1)}
.evpanel{background:var(--bg);border-bottom:1px solid var(--line);padding:0 18px}
.evhead{display:flex;gap:8px;align-items:center;padding:10px 0;flex-wrap:wrap}
.evlist{max-height:330px;overflow-y:auto;margin:0 -4px 12px;padding:0 4px}
.evitem{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;
  align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;margin-bottom:1px}
.evitem:hover{background:var(--panel2)}
.evdate{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;min-width:40px}
.evname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.evtag{font:10.5px var(--mono);color:var(--dim);border:1px solid var(--line);
  border-radius:10px;padding:1px 7px;text-transform:uppercase;letter-spacing:.4px;
  white-space:nowrap}
.evtag.fmt-1v1{color:var(--acc);border-color:rgba(110,168,254,.4)}
.evtag.fmt-2v2{color:var(--ok);border-color:rgba(95,191,127,.4)}
.evtag.fmt-teams{color:var(--warn);border-color:rgba(232,180,74,.4)}
.evtag.fmt-unknown{color:var(--dim);border-color:var(--line)}
.evlists{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;text-align:center}
.evlists.yes{color:var(--ok)}
.evlists.no{color:var(--err);opacity:.7}
.evlists.pending{color:var(--warn)}
.evlink{font:11.5px var(--mono);color:var(--acc);text-decoration:none;white-space:nowrap}
.evlink:hover{text-decoration:underline}
.hidden{display:none}
#user,#pass{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;font:13px var(--mono)}
#user{width:170px}
#pass{width:200px}
#user:focus,#pass:focus{outline:none;border-color:var(--acc)}
.authbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.authin{color:var(--ok);font:12px var(--mono);white-space:nowrap}
.authrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>MHQ Army Lists <span>parser</span></h1>
    <a class="ext" href="https://miniheadquarters.com/tournaments/team">MHQ</a>
    <form id="f">
      <input id="url" type="url" spellcheck="false" autocomplete="off"
             placeholder="https://miniheadquarters.com/tournaments/team/army-lists/&lt;slug&gt;">
      <button id="go" type="submit">Parse</button>
      <button id="browse" type="button" class="ghost">Browse</button>
      <!-- Opens the file picker. A real file input behind the button, so the OS
           dialog is the browser's own; kept out of sight and out of the tab
           order, since the button is what you reach for. -->
      <button id="filebtn" type="button" class="ghost" title="Parse a MiniHeadQuarters page you already saved (Ctrl+S in your browser) instead of fetching one">From file</button>
      <input id="file" type="file" accept=".html,.htm,text/html" class="hidden"
             aria-label="Saved MiniHeadQuarters page" tabindex="-1">
    </form>
  </div>
  <div id="status" class="status"></div>
</header>
<div id="evpanel" class="evpanel hidden">
  <div class="evhead">
    <input id="evq" type="search" placeholder="Filter events…">
    <select id="evfmt">
      <option value="">All formats</option>
      <option value="1v1">1v1</option>
      <option value="2v2 (side-by-side)">2v2 (side-by-side)</option>
      <option value="teams">Teams</option>
    </select>
    <label class="chk" title="List only the events you organise. Replaces the sitemap scan, which cannot see private or not-yet-published events. Needs a login."><input id="evadmin" type="checkbox"> organiser view</label>
    <!-- Sign-in sits next to organiser view, not at the top of the page: the
         public sitemap needs no session, so this is the one place an ask is
         ever warranted. Shown on organiser view, on an organiser URL in the
         box, or after a parse that came back 401. -->
    <span id="authbox" class="authbox hidden">
      <span id="signed" class="authin hidden"></span>
      <button id="logout" type="button" class="ghost hidden">Sign out</button>
      <form id="authform" class="authrow hidden" autocomplete="on">
        <input id="user" type="text" autocomplete="username" placeholder="MHQ username" aria-label="MHQ username">
        <input id="pass" type="password" autocomplete="current-password" placeholder="password" aria-label="MHQ password">
        <button id="login" type="submit">Sign in</button>
      </form>
    </span>
    <span id="evinfo" class="shown"></span>
    <span class="spacer"></span>
    <button id="evclose" type="button" class="ghost">Close</button>
  </div>
  <div id="evlist" class="evlist"></div>
</div>
<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
var NL = String.fromCharCode(10);
var WB = '> ' + String.fromCharCode(9888) + ' ';
// Header keys already shown elsewhere on the card, or that add no information.
var SKIP = {
  totalPoints: 1, detachment: 1, forceDisposition: 1,
  playerName: 1, teamName: 1, factionKeyword: 1
};
var data = null;
var view = { blocks: [], total: 0 };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function setStatus(msg, cls) {
  var s = $('#status');
  s.className = 'status' + (cls ? ' ' + cls : '');
  s.textContent = msg || '';
}
function isRealUnit(u) {
  return u.points && u.points < 1000 &&
    !/^(?:Strike Force|Force de Frappe|Force of|DA Recon)/i.test(u.model || '');
}
function blobOf(p) {
  var parts = [p.name, p.faction, p.teamName, p.format, p.status, p.adminId];
  if (p.meta) parts.push(p.meta.detachment, p.meta.forceDisposition);
  for (var i = 0; i < p.warnings.length; i++) parts.push(p.warnings[i].text);
  if (p.header) for (var k in p.header) parts.push(String(p.header[k]));
  for (var j = 0; j < (p.units || []).length; j++) {
    var u = p.units[j];
    parts.push(u.model, u.label, u.role, u.enhancements, u.attachedUnit, u.category);
    if (u.equipment) parts.push(u.equipment.join(' '));
    for (var m = 0; m < (u.models || []).length; m++) {
      parts.push(u.models[m].name);
      if (u.models[m].subs) parts.push(u.models[m].subs.join(' '));
    }
  }
  return parts.filter(function (x) { return x != null; }).join(' ').toLowerCase();
}

// One parse result, whichever way it arrived. The bar, the cards and the
// mini view are identical for a fetched URL and for a file, so they meet here;
// only the status line names the source.
function showResult(j, ms, via) {
  data = j;
  render();
  setStatus(j.count + ' arm' + (j.count === 1 ? 'y' : 'ies') + ' parsed ' + via +
    'in ' + Math.round(ms) + ' ms', 'ok');
}

async function parse() {
  var url = $('#url').value.trim();
  if (!url) return;
  var btn = $('#go');
  btn.disabled = true;
  setStatus('fetching + parsing…', 'busy');
  var t0 = performance.now();
  try {
    var r = await fetch('/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url, cookie: cookieOf() })
    });
    var j = await r.json().catch(function () { return { error: 'non-JSON response' }; });
    if (!r.ok || j.error) {
      var e2 = new Error(j.error || 'HTTP ' + r.status);
      if (j.auth) e2.auth = true;
      throw e2;
    }
    showResult(j, performance.now() - t0, '');
  } catch (e) {
    if (e.auth) {
      // An organiser URL with no session. Open the one place that can fix it
      // and remember the URL: signing in from there re-runs this parse.
      retryUrl = url;
      $('#evpanel').classList.remove('hidden');
      setState();
      focusLogin();
      // The parser's own message explains how to obtain a session, which is
      // advice for the command line. Here the next step is the form that just
      // opened, so say that instead of repeating instructions the page cannot
      // act on.
      setStatus('this page is organiser-only - sign in to parse it', 'err');
    } else {
      setStatus(String(e.message || e), 'err');
    }
  } finally {
    btn.disabled = false;
  }
}

function render() {
  var main = $('#main');
  main.textContent = '';
  view = { blocks: [], total: 0 };

  var ev = data.event;
  var teams = new Map();
  for (var i = 0; i < data.players.length; i++) {
    var p = data.players[i];
    var key = p.teamName || 'Unknown';
    if (!teams.has(key)) teams.set(key, []);
    teams.get(key).push(p);
  }

  var bar = el('div', 'bar');
  var left = el('div');
  left.appendChild(el('div', 'ev', ev.name));
  var bits = [];
  if (ev.date) bits.push(ev.date);
  bits.push(teams.size + ' team' + (teams.size === 1 ? '' : 's'));
  bits.push(data.count + ' arm' + (data.count === 1 ? 'y' : 'ies'));
  left.appendChild(el('div', 'meta', bits.join(' · ')));
  bar.appendChild(left);
  bar.appendChild(el('span', 'spacer'));

  var q = el('input');
  q.type = 'search';
  q.id = 'army-search';
  q.placeholder = 'Filter armies, models, equipment…';
  q.addEventListener('input', applyFilters);
  bar.appendChild(q);

  var sel = el('select');
  sel.id = 'faction-filter';
  var factions = Array.from(new Set(data.players.map(function (p) { return p.faction; })
    .filter(Boolean))).sort();
  var all = el('option', null, 'All factions');
  all.value = '';
  sel.appendChild(all);
  for (var f = 0; f < factions.length; f++) {
    var o = el('option', null, factions[f]);
    o.value = factions[f];
    sel.appendChild(o);
  }
  sel.addEventListener('change', applyFilters);
  bar.appendChild(sel);

  // Only admin parses carry a status; a public event shows no such control.
  var sts = Array.from(new Set(data.players.map(function (p) { return p.status; })
    .filter(Boolean))).sort();
  if (sts.length) {
    var ssel = el('select');
    ssel.id = 'status-filter';
    var sall = el('option', null, 'All statuses');
    sall.value = '';
    ssel.appendChild(sall);
    for (var k = 0; k < sts.length; k++) {
      var so = el('option', null, sts[k]);
      so.value = sts[k];
      ssel.appendChild(so);
    }
    ssel.addEventListener('change', applyFilters);
    bar.appendChild(ssel);
  }

  var lbl = el('label', 'chk');
  var cb = el('input');
  cb.type = 'checkbox';
  cb.id = 'warnings-only';
  cb.addEventListener('change', applyFilters);
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(' warnings only'));
  bar.appendChild(lbl);

  bar.appendChild(el('span', 'shown', data.count + ' / ' + data.count));
  var copy = el('button', 'ghost', 'Copy mini');
  copy.addEventListener('click', copyMini);
  bar.appendChild(copy);
  var dl = el('button', 'ghost', 'Download JSON');
  dl.addEventListener('click', downloadJson);
  bar.appendChild(dl);
  main.appendChild(bar);

  for (var team of Array.from(teams.keys())) {
    var players = teams.get(team);
    var block = el('section', 'tblock');
    var head = el('div', 'team');
    head.appendChild(el('b', null, team));
    head.appendChild(document.createTextNode(players.length + (players.length === 1 ? ' army' : ' armies')));
    block.appendChild(head);
    var grid = el('div', 'cards');
    var cards = [];
    for (var n = 0; n < players.length; n++) {
      var c = card(players[n]);
      cards.push({ node: c, p: players[n], blob: blobOf(players[n]) });
      grid.appendChild(c);
    }
    block.appendChild(grid);
    view.blocks.push({ node: block, cards: cards });
    view.total += players.length;
    main.appendChild(block);
  }
  if (view.total === 0) main.appendChild(el('div', 'empty', 'No armies found on this page.'));

  var mini = el('details', 'mini');
  mini.appendChild(el('summary', null, 'mini view (markdown)'));
  var pre = el('pre');
  pre.textContent = data.miniText || '';
  mini.appendChild(pre);
  main.appendChild(mini);

  applyFilters();
}

// Accepted reads green, rejected red, pending amber. Unknown statuses stay
// neutral so a new MHQ status still shows rather than disappearing.
function statusClass(s) {
  var v = String(s || '').toLowerCase();
  if (v.indexOf('accepted') === 0 || v.indexOf('validat') === 0) return ' ok';
  if (v.indexOf('reject') === 0) return ' bad';
  if (v.indexOf('pending') === 0) return ' warn';
  return '';
}

function card(p) {
  var c = el('article', 'card');

  c.appendChild(el('h3', null, p.name));
  if (p.status) c.appendChild(el('span', 'badge' + statusClass(p.status), p.status));
  var fbits = [p.faction, p.teamName, p.format ? 'format: ' + p.format : null].filter(Boolean);
  if (fbits.length) c.appendChild(el('div', 'faction', fbits.join(' · ')));

  var pts = el('div', 'points');
  pts.appendChild(el('span', 'big', p.totals.parsedPts));
  if (p.totals.declaredPts == null) {
    pts.appendChild(el('span', 'cmp', 'no total declared'));
  } else if (p.totals.declaredPts === p.totals.parsedPts) {
    pts.appendChild(el('span', 'cmp', '= declared ' + p.totals.declaredPts));
  } else {
    var d = p.totals.parsedPts - p.totals.declaredPts;
    pts.appendChild(el('span', 'cmp bad', 'declared ' + p.totals.declaredPts +
      ' (' + (d > 0 ? '+' : '') + d + ')'));
  }
  c.appendChild(pts);

  if (p.warnings.length) {
    c.classList.add('has-warn');
    var chips = el('div', 'chips');
    for (var i = 0; i < p.warnings.length; i++) {
      var t = p.warnings[i].text;
      chips.appendChild(el('span', 'chip', t.indexOf(WB) === 0 ? t.slice(WB.length) : t));
    }
    c.appendChild(chips);
  }

  var dg = el('dl', 'meta-grid');
  if (p.meta.detachment) {
    dg.appendChild(el('dt', null, 'Detachment'));
    dg.appendChild(el('dd', null, p.meta.detachment));
  }
  if (p.meta.forceDisposition) {
    dg.appendChild(el('dt', null, 'Force disp.'));
    dg.appendChild(el('dd', null, p.meta.forceDisposition));
  }
  if (p.header) {
    for (var k in p.header) {
      if (SKIP[k]) continue;
      dg.appendChild(el('dt', null, k));
      dg.appendChild(el('dd', null, String(p.header[k])));
    }
  }
  if (dg.childNodes.length) c.appendChild(dg);

  var units = (p.units || []).filter(isRealUnit);
  if (units.length) {
    var ul = el('div', 'units');
    for (var n = 0; n < units.length; n++) {
      var u = units[n];
      var row = el('div', 'unit');
      var m = el('span', 'm');
      m.appendChild(el('b', null, u.model || '(unnamed)'));
      var ub = [];
      if (u.label) ub.push(u.label);
      if (u.role) ub.push(u.role);
      if (u.enhancements) ub.push(u.enhancements);
      if (u.equipment && u.equipment.length) ub.push(u.equipment.join(', '));
      if (u.models && u.models.length) {
        ub.push(u.models.map(function (mm) {
          var s = (mm.count && mm.count > 1 ? mm.count + 'x ' : '') + mm.name;
          if (mm.subs && mm.subs.length) s += ' [' + mm.subs.join(', ') + ']';
          return s;
        }).join(', '));
      }
      if (u.attachedUnit) ub.push('attached: ' + u.attachedUnit);
      if (u.category) ub.push(u.category);
      if (ub.length) m.appendChild(el('small', null, ub.join(' · ')));
      row.appendChild(m);
      row.appendChild(el('span', 'p' + (u.points < 20 ? ' zero' : ''), String(u.points)));
      ul.appendChild(row);
    }
    c.appendChild(ul);
  }

  var raw = el('details');
  raw.appendChild(el('summary', null, 'raw list text'));
  var pre = el('pre');
  // bodyText carries the whole block including the +++ header; bodyRest stops after it.
  pre.textContent = p.bodyText || p.bodyRest || '';
  raw.appendChild(pre);
  c.appendChild(raw);

  return c;
}

function applyFilters() {
  var sEl = document.getElementById('faction-filter');
  var tEl = document.getElementById('status-filter');
  var qEl = document.getElementById('army-search');
  var cEl = document.getElementById('warnings-only');
  if (!qEl || !sEl || !cEl) return;
  var q = qEl.value.trim().toLowerCase();
  var fac = sEl.value;
  var st = tEl ? tEl.value : '';
  var wonly = cEl.checked;
  var shown = 0;
  for (var i = 0; i < view.blocks.length; i++) {
    var block = view.blocks[i];
    var any = false;
    for (var j = 0; j < block.cards.length; j++) {
      var cd = block.cards[j];
      var ok = (!q || cd.blob.indexOf(q) >= 0) &&
        (!fac || cd.p.faction === fac) &&
        (!st || cd.p.status === st) &&
        (!wonly || cd.p.warnings.length > 0);
      cd.node.classList.toggle('hidden', !ok);
      if (ok) { any = true; shown++; }
    }
    block.node.classList.toggle('hidden', !any);
  }
  var s = document.querySelector('.shown');
  if (s) s.textContent = shown + ' / ' + view.total;
}

function copyMini() {
  var text = (data && data.miniText) || '';
  var done = function (ok) {
    var s = document.querySelector('.shown');
    if (s) {
      var old = s.textContent;
      s.textContent = ok ? 'copied' : 'copy failed';
      setTimeout(function () { s.textContent = old; }, 1200);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    return;
  }
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  done(ok);
}

function downloadJson() {
  var clean = {
    event: data.event,
    count: data.count,
    players: data.players.map(function (p) {
      var rest = {};
      for (var k in p) {
        if (k === 'meta' || k === 'totals' || k === 'warnings') continue;
        rest[k] = p[k];
      }
      return rest;
    })
  };
  var blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (data.event.slug || 'mhq') + '_army_lists.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

// ---- event picker: pulls MHQ's tournament catalogue from its sitemap ---------
var evCache = [];
var evLoading = false;
// Which source evCache was loaded from: 'all' is the sitemap scan, 'mine' is
// the caller's own organised events. Reopening the picker with a different
// mode must refetch, not render a stale list.
var evMode = null;
// True when the organiser list came back empty because there is no session,
// rather than because nothing matched: it decides what the empty list says.
var evAuthPrompt = false;

var evPollTimer = null;
var evReqId = 0;

function showEvents() {
  $('#evpanel').classList.remove('hidden');
  var want = $('#evadmin').checked ? 'mine' : 'all';
  if ((!evCache.length || evMode !== want) && !evLoading) loadEvents();
  else renderEvList();
  // Opening the panel is what makes organiser view reachable at all, so the
  // sign-in that goes with it is decided here rather than on every keypress.
  setState();
}

function stopPolling() {
  if (evPollTimer) { clearTimeout(evPollTimer); evPollTimer = null; }
}

function loadEvents() {
  stopPolling();
  var reqId = ++evReqId;
  evLoading = true;
  $('#browse').disabled = true;
  $('#evinfo').textContent = 'loading…';
  // "organiser view" switches the data source, not just the URL shape: the
  // sitemap carries only public events, so a private or not-yet-published one
  // never appears in the scan at all. Ask MHQ for the caller's own list instead.
  var mine = $('#evadmin').checked;
  var req = mine
    ? fetch('/my-events', { headers: { 'X-MHQ-Cookie': cookieOf() || '' } })
    : fetch('/events?limit=250&filter=1');
  req.then(function (r) { return r.json(); })
    .then(function (j) {
      if (reqId !== evReqId) return;
      if (j.error) throw new Error(j.error);
      evMode = mine ? 'mine' : 'all';
      evCache = mine ? (j.organized || []) : (j.events || []);
      // Before renderEvList: it reads the flag to decide what an empty list says.
      if (mine) evAuthPrompt = !!j.auth;
      renderEvList();
      if (mine) {
        $('#evinfo').textContent = j.auth
          ? 'sign in to list the events you organise'
          : evCache.length + ' event' + (evCache.length === 1 ? '' : 's') + ' you organise';
      } else if (j.done === true) {
        $('#evinfo').textContent = j.count + ' events in the last ' + windowLabel(j.windowDays) +
          ' (' + j.scanned + ' checked)';
      } else if (j.total != null) {
        $('#evinfo').textContent = j.count + ' found · checking ' + j.scanned + ' of ' + j.total +
          ' in the last ' + windowLabel(j.windowDays) + '…';
        evPollTimer = setTimeout(loadEvents, 3000);
      }
    })
    .catch(function (e) { if (reqId === evReqId) $('#evinfo').textContent = 'error: ' + e.message; })
    .finally(function () { if (reqId === evReqId) { evLoading = false; $('#browse').disabled = false; } });
}

// 365 -> "year", 730 -> "2 years", 90 -> "90 days"; used in "in the last ...".
function windowLabel(days) {
  if (!days) return '';
  if (days >= 365 && days % 365 === 0) {
    var y = days / 365;
    return y + (y === 1 ? ' year' : ' years');
  }
  return days + ' days';
}

function fmtDate(d) {
  if (!d) return '';
  var m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[2] + '/' + m[3] : d;
}

function fmtClass(fmt) {
  return fmt === '1v1' ? 'fmt-1v1' : fmt === '2v2 (side-by-side)' ? 'fmt-2v2' :
    fmt === 'teams' ? 'fmt-teams' : 'fmt-unknown';
}

function renderEvList() {
  var list = $('#evlist');
  var q = ($('#evq').value || '').toLowerCase();
  var fmt = $('#evfmt').value || '';
  list.textContent = '';
  var n = 0;
  for (var i = 0; i < evCache.length; i++) {
    var e = evCache[i];
    if (fmt && e.format !== fmt) continue;
    if (q && (e.name + ' ' + e.slug).toLowerCase().indexOf(q) < 0) continue;
    n++;
    var row = el('div', 'evitem');
    row.addEventListener('click', (function (ev) {
      return function () {
        // Each row already carries the right form: /my-events returns the admin
        // URL, /events the public one, so nothing is rebuilt here.
        $('#url').value = ev.url;
        $('#evpanel').classList.add('hidden');
        stopPolling();
        parse();
      };
    })(e));
    row.appendChild(el('span', 'evdate', fmtDate(e.date)));
    var name = el('span', 'evname', e.name);
    if (e.future) name.appendChild(document.createTextNode(' (not yet)'));
    else if (e.past) name.appendChild(document.createTextNode(' (done)'));
    row.appendChild(name);
    row.appendChild(el('span', 'evtag ' + fmtClass(e.format), e.format || '?'));
    var lc = e.listCount ? 'yes' : 'pending';
    var li = e.listCount ? e.listCount + ' lists' : '\u2026';
    row.appendChild(el('span', 'evlists ' + lc, li));
    var link = el('a', 'evlink', '\u2197');
    link.href = e.detailsUrl;
    link.target = '_blank';
    link.addEventListener('click', function (ev) { ev.stopPropagation(); });
    row.appendChild(link);
    list.appendChild(row);
  }
  // With no session the organiser list is empty for want of one, not for want
  // of a match: the info line above says so, so do not also claim none exists.
  if (!n && !evAuthPrompt) list.appendChild(el('div', 'shown', 'no matching events'));
  $('#evinfo').textContent = n + ' of ' + evCache.length + ' events';
}

// "From file": the caller points at a MiniHeadQuarters page already saved on
// disk. The browser reads it and posts the bytes to /parse-file, which parses
// them with the same code a fetched URL goes through - no network round trip, no
// session. That is what makes a private, unpublished or offline page work.
async function parseFile(file) {
  var btn = $('#filebtn');
  btn.disabled = true;
  var t0 = performance.now();
  try {
    setStatus('reading ' + file.name + '…', 'busy');
    var text = await file.text();
    setStatus('parsing ' + file.name + '…', 'busy');
    var r = await fetch('/parse-file?name=' + encodeURIComponent(file.name), {
      method: 'POST',
      headers: { 'Content-Type': 'text/html; charset=utf-8' },
      body: text
    });
    var j = await r.json().catch(function () { return { error: 'non-JSON response' }; });
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
    showResult(j, performance.now() - t0, 'from ' + file.name + ' ');
  } catch (e) {
    setStatus(String(e.message || e), 'err');
  } finally {
    btn.disabled = false;
    // Clear the input: picking the same file twice in a row has to fire again.
    $('#file').value = '';
  }
}
$('#filebtn').addEventListener('click', function () { $('#file').click(); });
$('#file').addEventListener('change', function () {
  var f = $('#file').files[0];
  if (f) parseFile(f);
});

$('#browse').addEventListener('click', showEvents);
$('#evclose').addEventListener('click', function () {
  $('#evpanel').classList.add('hidden');
  stopPolling();
  setState();
});
$('#evq').addEventListener('input', renderEvList);
$('#evfmt').addEventListener('change', renderEvList);
$('#evadmin').addEventListener('change', function () {
  evCache = [];
  loadEvents();
  setState();
  // Ticking the box is a deliberate move into organiser view: start the form
  // where it has to be filled in rather than making the user find it.
  if (needsAuth() && !cookieOf()) focusLogin();
});
// An organiser URL pasted by hand needs the session too, so keep the sign-in
// in step with the box without opening the panel on every keystroke.
$('#url').addEventListener('input', setState);

// Session for organiser/admin URLs. The server only brokers the login: it
// never keeps a credential, so the session comes back here, is kept in this
// browser and is sent with every /parse. That is also why login and logout are
// local operations - there is nothing on the server to clear.
//
// Signing in is the only way in: there is no field for pasting a session by
// hand, so the value is written by /login and cleared by Sign out, never typed.
var SESSION_KEY = 'mhq_session';
var USER_KEY = 'mhq_user';
var session = null;
// The URL that came back 401, kept so signing in can finish what was started
// instead of leaving the user to press Parse a second time.
var retryUrl = null;
function cookieOf() { return session; }
function storeSession(v) {
  session = v || null;
  try { localStorage.setItem(SESSION_KEY, session || ''); } catch (e) {}
}
// The username is not a secret and a session lives about two weeks, so keeping
// it means an expired session costs one field rather than both.
function storeUser() {
  try { localStorage.setItem(USER_KEY, $('#user').value.trim()); } catch (e) {}
}
function isAdminUrl(u) { return /\/administrate\//.test(u || ''); }
// A session is asked for exactly when the content needs one: organiser view,
// an organiser URL already in the box, or a parse that just failed on auth.
// Public events come from the sitemap and need nothing.
function needsAuth() {
  return $('#evadmin').checked || isAdminUrl($('#url').value);
}
function setState() {
  var open = !$('#evpanel').classList.contains('hidden');
  var c = cookieOf();
  var u = $('#user').value.trim();
  // Signed in but browsing public events: say so, ask nothing. That state is
  // worth showing (it explains why an admin URL works) and costs no space.
  $('#authbox').classList.toggle('hidden', !open || (!needsAuth() && !c));
  $('#authform').classList.toggle('hidden', !!c);
  $('#signed').classList.toggle('hidden', !c);
  $('#logout').classList.toggle('hidden', !c);
  $('#signed').textContent = c ? (u ? 'signed in as ' + u : 'signed in') : '';
}
// Land on whichever field still needs filling.
function focusLogin() {
  var f = $('#user').value.trim() ? $('#pass') : $('#user');
  if (f) f.focus();
}
// The organiser list is behind the session, so it has to be re-read once one
// exists - and re-read on sign-out too, or the list stays up with no way left
// to fetch it.
function refreshAfterAuth() {
  if (!$('#evadmin').checked) return;
  evCache = [];
  loadEvents();
}
function doLogin(e) {
  if (e) e.preventDefault();
  var b = $('#login');
  var who = $('#user').value.trim();
  b.disabled = true;
  fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: who,
      password: $('#pass').value,
    }),
  }).then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.cookie) throw new Error((j && j.error) || 'login failed');
      storeSession(j.cookie);
      storeUser();
      $('#pass').value = '';
      setState();
      setStatus('signed in as ' + who, 'ok');
      refreshAfterAuth();
      // A parse was refused for want of a session a moment ago: run it again
      // now that there is one, rather than asking the user to press Parse.
      if (retryUrl) {
        var url = retryUrl;
        retryUrl = null;
        $('#url').value = url;
        parse();
      }
    })
    .catch(function (e) { setStatus(String(e.message || e), 'err'); })
    .finally(function () { b.disabled = false; });
}
(function initSes() {
  try { storeSession(localStorage.getItem(SESSION_KEY) || null); } catch (e) {}
  try { $('#user').value = localStorage.getItem(USER_KEY) || ''; } catch (e) {}
  // The value written by an earlier version of this page, when a session could
  // be pasted by hand. Nothing reads it now; drop it so it does not outlive the
  // field it belonged to.
  try { localStorage.removeItem('mhq_cookie'); } catch (e) {}
  $('#authform').addEventListener('submit', doLogin);
  $('#logout').addEventListener('click', function () {
    storeSession(null);
    $('#pass').value = '';
    setState();
    setStatus('signed out');
    refreshAfterAuth();
  });
  setState();
})();

$('#f').addEventListener('submit', function (e) {
  e.preventDefault();
  parse();
});
var prefill = new URLSearchParams(location.search).get('url');
if (prefill) {
  $('#url').value = prefill;
  parse();
}
</script>
</body>
